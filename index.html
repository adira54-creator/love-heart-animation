<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Our Journey ❤️</title>

<style>

/* =====================================================
   BASIC
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

.scene{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
}


/* =====================================================
   ALL BACKGROUNDS
===================================================== */

.background{
    position:absolute;
    inset:0;
    opacity:0;
    transition:opacity 1.2s ease;
    pointer-events:none;
}


/* GIRL ROOM */

.room{
    opacity:1;

    background:
        radial-gradient(
            circle at 50% 30%,
            #ffe8f1 0%,
            #f6b3cc 38%,
            #b76c8b 75%,
            #63364e 100%
        );
}

.room::before{
    content:"";

    position:absolute;

    width:75%;
    height:55%;

    left:12.5%;
    top:12%;

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.45),
            rgba(255,190,220,.15)
        );

    box-shadow:
        0 20px 50px rgba(80,20,50,.25);

    opacity:.7;
}


/* SNOW */

.snow{
    background:
        linear-gradient(
            #9fd2ed 0%,
            #dff5ff 48%,
            #ffffff 100%
        );
}


/* DESERT */

.desert{
    background:
        linear-gradient(
            #62c5ff 0%,
            #bdeaff 44%,
            #e6a45a 45%,
            #c77831 100%
        );
}


/* SPACE */

.space{
    background:
        radial-gradient(circle at 12% 20%,white 0 1px,transparent 2px),
        radial-gradient(circle at 30% 70%,white 0 1px,transparent 2px),
        radial-gradient(circle at 48% 15%,white 0 1px,transparent 2px),
        radial-gradient(circle at 66% 80%,white 0 1px,transparent 2px),
        radial-gradient(circle at 82% 30%,white 0 1px,transparent 2px),
        radial-gradient(circle at 91% 70%,white 0 1px,transparent 2px),
        #02030d;

    background-size:
        180px 180px,
        230px 230px,
        200px 200px,
        260px 260px,
        190px 190px,
        220px 220px,
        auto;
}


/* =====================================================
   ROOM DOOR
===================================================== */

.door{
    position:absolute;

    width:115px;
    height:235px;

    right:7%;
    bottom:7%;

    border-radius:8px 8px 0 0;

    background:
        linear-gradient(
            90deg,
            #55301f,
            #8b5638,
            #4b291b
        );

    border:5px solid #3b2117;

    box-shadow:
        inset 8px 0 15px rgba(0,0,0,.3),
        0 15px 35px rgba(0,0,0,.3);

    transform-origin:left center;

    transform:perspective(500px)
             rotateY(0deg);

    opacity:0;

    z-index:2;
}

.door::after{
    content:"";

    position:absolute;

    width:12px;
    height:12px;

    border-radius:50%;

    right:13px;
    top:50%;

    background:#f5d58a;
}

.door.open{
    animation:doorOpen 1s forwards;
}

@keyframes doorOpen{

    0%{
        opacity:0;
        transform:perspective(500px)
                   rotateY(0deg);
    }

    20%{
        opacity:1;
    }

    100%{
        opacity:1;
        transform:perspective(500px)
                   rotateY(-68deg);
    }
}


/* =====================================================
   CHARACTERS
===================================================== */

.person{
    position:absolute;

    width:auto;

    height:54vh;

    max-height:560px;

    object-fit:contain;

    z-index:10;

    user-select:none;

    pointer-events:none;
}


/* GIRL */

.girl{
    left:7%;
    bottom:8vh;

    transform-origin:
        50% 85%;
}


/* BOY */

.boy{
    right:7%;
    bottom:8vh;

    transform-origin:
        50% 85%;
}


/* =====================================================
   GIRL THROWING MOTION
===================================================== */

.girl.throwing{

    animation:
        girlThrow
        1.15s
        cubic-bezier(.25,.7,.25,1)
        forwards;
}

@keyframes girlThrow{

    0%{
        transform:
            translateX(0)
            rotate(0deg);
    }

    25%{
        transform:
            translateX(7px)
            rotate(-3deg);
    }

    50%{
        transform:
            translateX(16px)
            rotate(4deg);
    }

    75%{
        transform:
            translateX(7px)
            rotate(-2deg);
    }

    100%{
        transform:
            translateX(0)
            rotate(0deg);
    }
}


/* =====================================================
   SMALL HEART IN GIRL'S HAND
===================================================== */

.throwHeart{

    position:absolute;

    left:21%;
    bottom:38%;

    font-size:25px;

    z-index:20;

    filter:
        drop-shadow(
            0 0 10px
            rgba(255,70,130,.8)
        );

    transform-origin:center;
}


/* HEART THROW */

.throwHeart.fly{

    animation:
        heartTravel
        2.7s
        cubic-bezier(.25,.7,.2,1)
        forwards;
}


@keyframes heartTravel{

    0%{

        left:21%;
        bottom:38%;

        transform:
            scale(.45)
            rotate(0deg);

        opacity:1;
    }

    15%{

        left:27%;
        bottom:43%;

        transform:
            scale(.65)
            rotate(-8deg);

        opacity:1;
    }

    40%{

        left:43%;
        bottom:51%;

        transform:
            scale(1.05)
            rotate(12deg);
    }

    65%{

        left:60%;
        bottom:47%;

        transform:
            scale(1.35)
            rotate(-10deg);
    }

    88%{

        left:73%;
        bottom:37%;

        transform:
            scale(1.55)
            rotate(8deg);
    }

    100%{

        left:82%;
        bottom:30%;

        transform:
            scale(1.8)
            rotate(0deg);

        opacity:1;
    }
}


/* =====================================================
   IMPACT
===================================================== */

.boy.hit{

    animation:
        boyImpact
        .9s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}

@keyframes boyImpact{

    0%{
        transform:
            translate(0,0)
            rotate(0deg);
    }

    18%{
        transform:
            translate(30px,-18px)
            rotate(8deg);
    }

    38%{
        transform:
            translate(-22px,-38px)
            rotate(-9deg);
    }

    60%{
        transform:
            translate(18px,-12px)
            rotate(6deg);
    }

    80%{
        transform:
            translate(-8px,0)
            rotate(-3deg);
    }

    100%{
        transform:
            translate(0,0)
            rotate(0deg);
    }
}


/* IMPACT FLASH */

.impact{

    position:absolute;

    width:40px;
    height:40px;

    border-radius:50%;

    right:17%;
    bottom:34%;

    z-index:25;

    opacity:0;

    background:
        radial-gradient(
            circle,
            #fff 0%,
            #ff8bb8 35%,
            transparent 70%
        );
}

.impact.show{

    animation:
        impactFlash
        .65s
        ease-out
        forwards;
}

@keyframes impactFlash{

    0%{
        opacity:0;
        transform:scale(.3);
    }

    25%{
        opacity:1;
        transform:scale(2.2);
    }

    100%{
        opacity:0;
        transform:scale(4);
    }
}


/* =====================================================
   BOY HOLDING HEART
===================================================== */

.heldHeart{

    position:absolute;

    z-index:16;

    font-size:52px;

    opacity:0;

    filter:
        drop-shadow(
            0 0 14px
            rgba(255,50,100,.9)
        );

    pointer-events:none;
}


/* SHOW HEART IN BOY'S HANDS */

.heldHeart.show{
    opacity:1;
}


/* SNOW / DESERT HEART POSITION */

.heldHeart.travelHeart{

    left:70%;
    top:52%;

    transform:
        translate(-50%,-50%)
        scale(.9);
}


/* =====================================================
   BOY TRAVELING
===================================================== */

.boy.snowMove{

    animation:
        snowTravel
        3.2s
        ease-in-out
        forwards;
}

@keyframes snowTravel{

    0%{
        right:7%;
        bottom:8vh;
        transform:scale(1);
    }

    40%{
        right:30%;
        bottom:10vh;
        transform:scale(.88);
    }

    75%{
        right:55%;
        bottom:9vh;
        transform:scale(.82);
    }

    100%{
        right:72%;
        bottom:8vh;
        transform:scale(.78);
    }
}


/* =====================================================
   DESERT TRAVEL
===================================================== */

.boy.desertMove{

    animation:
        desertTravel
        3.2s
        ease-in-out
        forwards;
}

@keyframes desertTravel{

    0%{
        left:auto;
        right:72%;
        bottom:8vh;
        transform:scale(.78);
    }

    30%{
        right:52%;
        bottom:14vh;
        transform:scale(.72);
    }

    60%{
        right:28%;
        bottom:11vh;
        transform:scale(.68);
    }

    100%{
        right:8%;
        bottom:8vh;
        transform:scale(.64);
    }
}


/* =====================================================
   EARTH
===================================================== */

.earth{

    position:absolute;

    width:220px;
    height:220px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(.2);

    opacity:0;

    border-radius:50%;

    z-index:5;

    background:

        radial-gradient(
            circle at 32% 28%,
            rgba(255,255,255,.7) 0 2%,
            transparent 3%
        ),

        radial-gradient(
            ellipse at 35% 40%,
            #4da84d 0 9%,
            transparent 10%
        ),

        radial-gradient(
            ellipse at 62% 30%,
            #58b957 0 8%,
            transparent 9%
        ),

        radial-gradient(
            ellipse at 63% 66%,
            #4b9f48 0 12%,
            transparent 13%
        ),

        radial-gradient(
            ellipse at 30% 72%,
            #63b957 0 7%,
            transparent 8%
        ),

        radial-gradient(
            circle at 35% 30%,
            #74d9ff 0%,
            #2588d4 48%,
            #07508e 78%,
            #021b35 100%
        );

    box-shadow:
        0 0 30px #53c9ff,
        0 0 75px rgba(50,170,255,.7),
        inset -25px -15px 35px rgba(0,0,0,.45);
}

.earth.show{

    animation:
        earthAppear
        1.2s
        ease-out
        forwards;
}

@keyframes earthAppear{

    from{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(.2);
    }

    to{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1);
    }
}


/* =====================================================
   ORBIT
===================================================== */

.orbitSystem{

    position:absolute;

    width:520px;
    height:520px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    z-index:12;

    opacity:0;
}

.orbitSystem.show{

    opacity:1;

    animation:
        orbitSpin
        7s
        linear
        infinite;
}

@keyframes orbitSpin{

    from{
        transform:
            translate(-50%,-50%)
            rotate(0deg);
    }

    to{
        transform:
            translate(-50%,-50%)
            rotate(360deg);
    }
}


/* ORBIT PATH */

.orbitPath{

    position:absolute;

    width:440px;
    height:300px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        rotate(-12deg);

    border:
        2px solid
        rgba(255,255,255,.38);

    border-radius:50%;

    box-shadow:
        0 0 15px
        rgba(255,255,255,.12);
}


/* BOY INSIDE ORBIT */

.orbitBoy{

    position:absolute;

    width:auto;
    height:190px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    object-fit:contain;

    z-index:20;

    /* keeps boy upright while orbit system rotates */

    animation:
        keepBoyUpright
        7s
        linear
        infinite;
}

@keyframes keepBoyUpright{

    from{
        transform:
            translate(-50%,-50%)
            rotate(0deg);
    }

    to{
        transform:
            translate(-50%,-50%)
            rotate(-360deg);
    }
}


/* =====================================================
   RETURN
===================================================== */

.boy.returnHome{

    animation:
        returnHome
        3.2s
        ease-in-out
        forwards;
}

@keyframes returnHome{

    0%{
        left:50%;
        top:50%;

        transform:
            translate(-50%,-50%)
            scale(.4);
    }

    50%{
        left:65%;
        top:60%;

        transform:
            translate(-50%,-50%)
            scale(.7);
    }

    100%{
        left:auto;
        right:7%;
        top:auto;
        bottom:8vh;

        transform:
            scale(1);
    }
}
