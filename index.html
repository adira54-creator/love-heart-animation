<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Journey ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

.scene{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
}

/* ---------- BACKGROUNDS ---------- */

.home{
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at 50% 30%,#ffd6e7 0%,#f7a9c5 35%,#9b5575 100%);
}

.snow{
    position:absolute;
    inset:0;
    opacity:0;
    background:
        linear-gradient(#b9d9ef,#eaf7ff 60%,#fff);
    transition:opacity 1s;
}

.desert{
    position:absolute;
    inset:0;
    opacity:0;
    background:
        linear-gradient(#69c9ff 0%,#bcecff 45%,#e6a653 46%,#c77b32 100%);
    transition:opacity 1s;
}

.space{
    position:absolute;
    inset:0;
    opacity:0;
    background:
        radial-gradient(circle at 20% 30%,white 1px,transparent 2px),
        radial-gradient(circle at 70% 20%,white 1px,transparent 2px),
        radial-gradient(circle at 40% 75%,white 1px,transparent 2px),
        radial-gradient(circle at 85% 65%,white 1px,transparent 2px),
        #02020d;
    background-size:180px 180px;
    transition:opacity 1s;
}

/* ---------- CHARACTERS ---------- */

.person{
    position:absolute;
    height:55vh;
    max-height:520px;
    width:auto;
    bottom:7vh;
    object-fit:contain;
    z-index:5;
}

.girl{
    left:8%;
}

.boy{
    right:8%;
}

/* ---------- HEART ---------- */

.heart{
    position:absolute;
    z-index:10;
    left:43%;
    bottom:36%;
    font-size:65px;
    filter:drop-shadow(0 0 15px #ff4f91);
    transform:scale(1);
}

/* ---------- THROW ---------- */

.throw{
    animation:throwHeart 1.8s ease-in forwards;
}

@keyframes throwHeart{
    0%{
        left:43%;
        bottom:36%;
        transform:scale(1) rotate(0deg);
    }

    50%{
        left:62%;
        bottom:43%;
        transform:scale(1.25) rotate(20deg);
    }

    100%{
        left:82%;
        bottom:45%;
        transform:scale(.7) rotate(40deg);
    }
}

/* ---------- HIT ---------- */

.hit{
    animation:hitBoy .8s ease forwards;
}

@keyframes hitBoy{
    0%{transform:translateX(0) rotate(0);}
    35%{transform:translateX(35px) rotate(8deg);}
    70%{transform:translateX(-25px) rotate(-8deg);}
    100%{transform:translateX(0) rotate(0);}
}

/* ---------- PORTAL ---------- */

.portal{
    position:absolute;
    width:150px;
    height:230px;
    right:4%;
    bottom:20%;
    border-radius:50% 50% 10% 10%;
    background:radial-gradient(circle,#fff,#9c5cff 35%,#31105e 70%,transparent 72%);
    box-shadow:0 0 35px #b56cff,0 0 80px #7b29ff;
    opacity:0;
    transform:scale(.2);
    z-index:3;
}

.portal.open{
    animation:portalOpen 1.5s forwards;
}

@keyframes portalOpen{
    0%{
        opacity:0;
        transform:scale(.2);
    }
    60%{
        opacity:1;
        transform:scale(1.15);
    }
    100%{
        opacity:1;
        transform:scale(1);
    }
}

/* ---------- BOY JOURNEY ---------- */

.travel{
    animation:travelBoy 3.5s ease-in-out forwards;
}

@keyframes travelBoy{
    0%{
        right:8%;
        bottom:7vh;
        transform:scale(1);
    }

    30%{
        right:3%;
        bottom:20vh;
        transform:scale(.7);
    }

    60%{
        right:42%;
        bottom:45vh;
        transform:scale(.55);
    }

    100%{
        right:50%;
        bottom:42vh;
        transform:scale(.45);
    }
}

/* ---------- DESERT JOURNEY ---------- */

.desertMove{
    animation:desertMove 3s ease-in-out forwards;
}

@keyframes desertMove{
    0%{
        right:50%;
        bottom:42vh;
        transform:scale(.45);
    }

    50%{
        right:25%;
        bottom:28vh;
        transform:scale(.5);
    }

    100%{
        right:50%;
        bottom:40vh;
        transform:scale(.4);
    }
}

/* ---------- EARTH ---------- */

.earth{
    position:absolute;
    width:180px;
    height:180px;
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:
        radial-gradient(circle at 35% 35%,#6ee7ff,#1877d2 45%,#06345f 75%);
    box-shadow:
        0 0 30px #4dc7ff,
        0 0 70px #1685d8;
    opacity:0;
    z-index:2;
}

.earth.show{
    animation:earthShow 1s forwards;
}

@keyframes earthShow{
    from{
        opacity:0;
        transform:translate(-50%,-50%) scale(.4);
    }
    to{
        opacity:1;
        transform:translate(-50%,-50%) scale(1);
    }
}

/* ---------- ORBIT ---------- */

.orbit{
    position:absolute;
    width:330px;
    height:180px;
    border:2px solid rgba(255,255,255,.45);
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) rotate(-15deg);
    opacity:0;
}

.orbit.show{
    animation:orbitShow 1s forwards;
}

@keyframes orbitShow{
    from{opacity:0;}
    to{opacity:1;}
}

.orbitBoy{
    animation:orbitBoy 4s linear infinite;
}

@keyframes orbitBoy{
    0%{
        transform:translate(-165px,-10px) scale(.35);
    }

    25%{
        transform:translate(-50px,-100px) scale(.32);
    }

    50%{
        transform:translate(165px,-10px) scale(.35);
    }

    75%{
        transform:translate(50px,90px) scale(.32);
    }

    100%{
        transform:translate(-165px,-10px) scale(.35);
    }
}

/* ---------- RETURN ---------- */

.return{
    animation:returnBoy 3s ease-in forwards;
}

@keyframes returnBoy{
    0%{
        right:50%;
        bottom:40vh;
        transform:scale(.4);
    }

    50%{
        right:30%;
        bottom:30vh;
        transform:scale(.6);
    }

    100%{
        right:18%;
        bottom:7vh;
        transform:scale(1);
    }
}

/* ---------- HUG ---------- */

.hug{
    position:absolute;
    width:auto;
    height:65vh;
    max-height:600px;
    left:50%;
    bottom:3vh;
    transform:translateX(-50%) scale(.5);
    opacity:0;
    z-index:20;
}

.hug.show{
    animation:hugShow 1.5s ease-out forwards;
}

@keyframes hugShow{
    0%{
        opacity:0;
        transform:translateX(-50%) scale(.5);
    }

    70%{
        opacity:1;
        transform:translateX(-50%) scale(1.08);
    }

    100%{
        opacity:1;
        transform:translateX(-50%) scale(1);
    }
}

/* ---------- FINAL HEARTS ---------- */

.finalHeart{
    position:absolute;
    font-size:30px;
    z-index:30;
    opacity:0;
}

.h1{left:20%;bottom:20%;}
.h2{left:35%;bottom:35%;}
.h3{left:55%;bottom:25%;}
.h4{left:70%;bottom:40%;}
.h5{left:45%;bottom:55%;}

.hearts .finalHeart{
    animation:floatHeart 3s ease-in-out infinite;
}

@keyframes floatHeart{
    0%{
        opacity:0;
        transform:translateY(20px) scale(.5);
    }

    30%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:translateY(-150px) scale(1.3);
    }
}

/* ---------- MOBILE ---------- */

@media(max-width:600px){

    .person{
        height:43vh;
        bottom:9vh;
    }

    .girl{
        left:2%;
    }

    .boy{
        right:2%;
    }

    .heart{
        font-size:48px;
        left:43%;
        bottom:32%;
    }

    .portal{
        width:100px;
        height:170px;
    }

    .earth{
        width:130px;
        height:130px;
    }

    .orbit{
        width:250px;
        height:140px;
    }

    .hug{
        height:55vh;
        bottom:7vh;
    }
}
</style>
</head>

<body>

<div class="scene">

    <!-- BACKGROUNDS -->
    <div class="home" id="home"></div>
    <div class="snow" id="snow"></div>
    <div class="desert" id="desert"></div>
    <div class="space" id="space"></div>

    <!-- CHARACTERS -->
    <img src="Girl.png" class="person girl" id="girl">
    <img src="Boy.png" class="person boy" id="boy">

    <!-- HEART -->
    <div class="heart" id="heart">❤️</div>

    <!-- PORTAL -->
    <div class="portal" id="portal"></div>

    <!-- EARTH -->
    <div class="earth" id="earth"></div>
    <div class="orbit" id="orbit"></div>

    <!-- FINAL HUG -->
    <img src="Hug.png" class="hug" id="hug">

    <!-- FLOATING HEARTS -->
    <div class="finalHeart h1">❤️</div>
    <div class="finalHeart h2">💗</div>
    <div class="finalHeart h3">💕</div>
    <div class="finalHeart h4">❤️</div>
    <div class="finalHeart h5">💖</div>

</div>

<script>

const heart = document.getElementById("heart");
const boy = document.getElementById("boy");
const portal = document.getElementById("portal");

const snow = document.getElementById("snow");
const desert = document.getElementById("desert");
const space = document.getElementById("space");

const earth = document.getElementById("earth");
const orbit = document.getElementById("orbit");

const hug = document.getElementById("hug");

const finalHearts = document.querySelectorAll(".finalHeart");


/* 1 — HEART THROW */

setTimeout(() => {
    heart.classList.add("throw");
},2000);


/* 2 — HEART HITS BOY */

setTimeout(() => {
    heart.style.opacity="0";
    boy.classList.add("hit");
},3800);


/* 3 — PORTAL OPENS */

setTimeout(() => {
    portal.classList.add("open");
},4800);


/* 4 — BOY ENTERS PORTAL */

setTimeout(() => {
    boy.classList.add("travel");
},5700);


/* 5 — SNOW WORLD */

setTimeout(() => {
    snow.style.opacity="1";
},7200);


/* 6 — DESERT */

setTimeout(() => {
    snow.style.opacity="0";
    desert.style.opacity="1";

    boy.classList.remove("travel");
    boy.classList.add("desertMove");
},10500);


/* 7 — SPACE */

setTimeout(() => {

    desert.style.opacity="0";
    space.style.opacity="1";

    boy.style.opacity="0";

    earth.classList.add("show");
    orbit.classList.add("show");

},13500);


/* 8 — BOY ORBITS EARTH */

setTimeout(() => {

    boy.style.opacity="1";

    boy.classList.remove("desertMove");

    boy.style.position="absolute";
    boy.style.left="50%";
    boy.style.top="50%";
    boy.style.right="auto";
    boy.style.bottom="auto";

    boy.classList.add("orbitBoy");

},14500);


/* 9 — RETURN */

setTimeout(() => {

    boy.classList.remove("orbitBoy");

    earth.style.opacity="0";
    orbit.style.opacity="0";

    boy.classList.add("return");

},19000);


/* 10 — FINAL HUG */

setTimeout(() => {

    boy.style.opacity="0";
    hug.classList.add("show");

},22000);


/* 11 — HEARTS */

setTimeout(() => {

    document.body.classList.add("hearts");

    finalHearts.forEach((h,i)=>{
        h.style.animationDelay=(i*0.4)+"s";
    });

},23000);

</script>

</body>
</html>
