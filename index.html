<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Journey ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

.scene{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
}

/* BACKGROUNDS */

.bg{
    position:absolute;
    inset:0;
    opacity:0;
    transition:opacity 1s ease;
}

.room{
    opacity:1;
    background:
    radial-gradient(circle at 50% 25%,
    #ffe7f0 0%,
    #f7b0c9 40%,
    #9b5675 100%);
}

.room:after{
    content:"";
    position:absolute;
    left:8%;
    right:8%;
    bottom:0;
    height:34%;
    background:
    linear-gradient(#d99bb2,#a86682);
    border-radius:50% 50% 0 0;
    opacity:.45;
}

.snow{
    background:
    linear-gradient(
        #9ccde8 0%,
        #dff5ff 55%,
        #ffffff 100%
    );
}

.desert{
    background:
    linear-gradient(
        #59c5ff 0%,
        #bceaff 44%,
        #e5a45a 45%,
        #c47730 100%
    );
}

.space{
    background:
    radial-gradient(circle at 10% 20%,white 1px,transparent 2px),
    radial-gradient(circle at 25% 70%,white 1px,transparent 2px),
    radial-gradient(circle at 45% 15%,white 1px,transparent 2px),
    radial-gradient(circle at 62% 75%,white 1px,transparent 2px),
    radial-gradient(circle at 78% 25%,white 1px,transparent 2px),
    radial-gradient(circle at 90% 65%,white 1px,transparent 2px),
    #02030d;
}

/* DOOR */

.door{
    position:absolute;
    width:115px;
    height:235px;
    right:6%;
    bottom:6%;
    background:
    linear-gradient(
        90deg,
        #422316,
        #8b5436,
        #4a2819
    );
    border:5px solid #32190f;
    border-radius:8px 8px 0 0;
    box-shadow:0 15px 35px rgba(0,0,0,.4);
    transform-origin:left center;
    opacity:0;
    z-index:4;
}

.door:after{
    content:"";
    position:absolute;
    width:11px;
    height:11px;
    border-radius:50%;
    background:#f5d27b;
    right:12px;
    top:50%;
}

.door.open{
    animation:doorOpen 1s forwards;
}

@keyframes doorOpen{
    0%{
        opacity:0;
        transform:perspective(500px) rotateY(0);
    }
    20%{
        opacity:1;
    }
    100%{
        opacity:1;
        transform:perspective(500px) rotateY(-70deg);
    }
}

/* CHARACTERS */

.person{
    position:absolute;
    width:auto;
    height:54vh;
    max-height:560px;
    object-fit:contain;
    z-index:10;
    pointer-events:none;
}

.girl{
    left:5%;
    bottom:7vh;
    transform-origin:50% 85%;
}

.boy{
    right:5%;
    bottom:7vh;
    transform-origin:50% 85%;
}
      /* GIRL THROWING */

.girl.throw{
    animation:
    girlThrow
    1.1s
    cubic-bezier(.25,.8,.25,1)
    forwards;
}

@keyframes girlThrow{

    0%{
        transform:translateX(0) rotate(0);
    }

    25%{
        transform:translateX(7px) rotate(-3deg);
    }

    50%{
        transform:translateX(17px) rotate(5deg);
    }

    75%{
        transform:translateX(7px) rotate(-2deg);
    }

    100%{
        transform:translateX(0) rotate(0);
    }
}

/* HEART */

.heart{
    position:absolute;
    left:22%;
    bottom:39%;
    font-size:24px;
    z-index:30;
    filter:drop-shadow(0 0 10px #ff4f91);
}

.heart.fly{
    animation:
    heartFly
    2.7s
    cubic-bezier(.2,.75,.2,1)
    forwards;
}

@keyframes heartFly{

    0%{
        left:22%;
        bottom:39%;
        transform:scale(.45) rotate(0);
    }

    15%{
        left:28%;
        bottom:44%;
        transform:scale(.65) rotate(-8deg);
    }

    38%{
        left:43%;
        bottom:51%;
        transform:scale(1) rotate(12deg);
    }

    62%{
        left:59%;
        bottom:48%;
        transform:scale(1.35) rotate(-10deg);
    }

    85%{
        left:73%;
        bottom:39%;
        transform:scale(1.65) rotate(8deg);
    }

    100%{
        left:82%;
        bottom:31%;
        transform:scale(1.8) rotate(0);
    }
}

/* IMPACT */

.impact{
    position:absolute;
    right:15%;
    bottom:31%;
    width:70px;
    height:70px;
    border-radius:50%;
    background:
    radial-gradient(
        circle,
        #fff 0%,
        #ff82b0 30%,
        transparent 70%
    );
    z-index:25;
    opacity:0;
}

.impact.show{
    animation:impact .7s ease-out forwards;
}

@keyframes impact{
    0%{
        opacity:0;
        transform:scale(.2);
    }

    30%{
        opacity:1;
        transform:scale(1.8);
    }

    100%{
        opacity:0;
        transform:scale(3.5);
    }
}

/* BOY HIT */

.boy.hit{
    animation:
    hit
    .9s
    cubic-bezier(.2,.8,.2,1)
    forwards;
}

@keyframes hit{

    0%{
        transform:translate(0,0) rotate(0);
    }

    20%{
        transform:translate(35px,-22px) rotate(9deg);
    }

    40%{
        transform:translate(-25px,-42px) rotate(-9deg);
    }

    60%{
        transform:translate(20px,-15px) rotate(6deg);
    }

    80%{
        transform:translate(-8px,0) rotate(-3deg);
    }

    100%{
        transform:translate(0,0) rotate(0);
    }
}

/* HEART IN BOY'S HAND */

.handHeart{
    position:absolute;
    font-size:43px;
    z-index:18;
    opacity:0;
    filter:drop-shadow(0 0 12px #ff4f91);
    pointer-events:none;
}

.handHeart.show{
    opacity:1;
}
      /* SNOW */

.snowflakes{
    position:absolute;
    inset:0;
    z-index:3;
    opacity:0;
    pointer-events:none;
}

.snowflakes.show{
    opacity:1;
}

.flake{
    position:absolute;
    top:-30px;
    color:#fff;
    font-size:17px;
    opacity:.85;
    animation:snowfall linear infinite;
}

@keyframes snowfall{
    from{
        transform:translateY(-30px) translateX(0) rotate(0);
    }

    to{
        transform:translateY(110vh) translateX(80px) rotate(360deg);
    }
}

/* BOY SNOW TRAVEL */

.boy.snowTravel{
    animation:
    snowTravel
    3s
    ease-in-out
    forwards;
}

@keyframes snowTravel{

    0%{
        right:5%;
        bottom:7vh;
        transform:scale(1);
    }

    30%{
        right:25%;
        bottom:9vh;
        transform:scale(.9);
    }

    65%{
        right:50%;
        bottom:8vh;
        transform:scale(.82);
    }

    100%{
        right:72%;
        bottom:7vh;
        transform:scale(.76);
    }
}

/* DESERT */

.boy.desertTravel{
    animation:
    desertTravel
    3s
    ease-in-out
    forwards;
}

@keyframes desertTravel{

    0%{
        right:72%;
        bottom:7vh;
        transform:scale(.76);
    }

    30%{
        right:52%;
        bottom:14vh;
        transform:scale(.72);
    }

    65%{
        right:27%;
        bottom:10vh;
        transform:scale(.68);
    }

    100%{
        right:6%;
        bottom:7vh;
        transform:scale(.64);
    }
}

/* EARTH */

.earth{
    position:absolute;
    width:220px;
    height:220px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(.2);
    border-radius:50%;
    opacity:0;
    z-index:5;

    background:
    radial-gradient(
        ellipse at 30% 35%,
        #54ad4e 0 9%,
        transparent 10%
    ),
    radial-gradient(
        ellipse at 65% 30%,
        #63b85b 0 8%,
        transparent 9%
    ),
    radial-gradient(
        ellipse at 62% 67%,
        #4da348 0 13%,
        transparent 14%
    ),
    radial-gradient(
        ellipse at 30% 72%,
        #61b552 0 7%,
        transparent 8%
    ),
    radial-gradient(
        circle at 35% 30%,
        #75dcff,
        #248bd7 48%,
        #07518e 78%,
        #021c36
    );

    box-shadow:
    0 0 35px #53caff,
    0 0 80px rgba(60,180,255,.65),
    inset -25px -15px 35px rgba(0,0,0,.45);
}

.earth.show{
    animation:earthShow 1.2s ease-out forwards;
}

@keyframes earthShow{

    from{
        opacity:0;
        transform:translate(-50%,-50%) scale(.2);
    }

    to{
        opacity:1;
        transform:translate(-50%,-50%) scale(1);
    }
}

/* ORBIT */

.orbit{
    position:absolute;
    width:500px;
    height:360px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) rotate(-12deg);
    border:2px solid rgba(255,255,255,.4);
    border-radius:50%;
    z-index:12;
    opacity:0;
}

.orbit.show{
    opacity:1;
    animation:orbitRotate 6s linear infinite;
}

@keyframes orbitRotate{
    from{
        transform:
        translate(-50%,-50%)
        rotate(-12deg);
    }

    to{
        transform:
        translate(-50%,-50%)
        rotate(348deg);
    }
}

/* ORBIT BOY */

.orbitBoy{
    position:absolute;
    width:auto;
    height:175px;
    left:50%;
    top:50%;
    z-index:20;
    object-fit:contain;

    animation:
    boyOrbit
    6s
    linear
    infinite;
}

@keyframes boyOrbit{

    0%{
        transform:
        translate(-250px,-10px)
        scale(.55)
        rotate(0);
    }

    12.5%{
        transform:
        translate(-175px,-120px)
        scale(.48)
        rotate(0);
    }

    25%{
        transform:
        translate(0,-180px)
        scale(.42)
        rotate(0);
    }

    37.5%{
        transform:
        translate(175px,-120px)
        scale(.48)
        rotate(0);
    }

    50%{
        transform:
        translate(250px,-10px)
        scale(.55)
        rotate(0);
    }

    62.5%{
        transform:
        translate(175px,110px)
        scale(.48)
        rotate(0);
    }

    75%{
        transform:
        translate(0,180px)
        scale(.42)
        rotate(0);
    }

    87.5%{
        transform:
        translate(-175px,110px)
        scale(.48)
        rotate(0);
    }

    100%{
        transform:
        translate(-250px,-10px)
        scale(.55)
        rotate(0);
    }
}
      /* RETURN HOME */

.returnBoy{
    animation:
    returnHome
    3s
    ease-in-out
    forwards;
}

@keyframes returnHome{

    0%{
        left:50%;
        top:50%;
        transform:
        translate(-50%,-50%)
        scale(.45);
    }

    50%{
        left:65%;
        top:60%;
        transform:
        translate(-50%,-50%)
        scale(.7);
    }

    100%{
        left:auto;
        right:5%;
        top:auto;
        bottom:7vh;
        transform:scale(1);
    }
}

/* FINAL HUG */

.hug{
    position:absolute;
    width:auto;
    height:70vh;
    max-height:650px;
    left:50%;
    bottom:2vh;
    transform:
    translateX(-50%)
    scale(.45);
    opacity:0;
    z-index:50;
    object-fit:contain;
    pointer-events:none;
}

.hug.show{
    animation:
    hugShow
    1.5s
    cubic-bezier(.2,.8,.2,1)
    forwards;
}

@keyframes hugShow{

    0%{
        opacity:0;
        transform:
        translateX(-50%)
        scale(.45);
    }

    65%{
        opacity:1;
        transform:
        translateX(-50%)
        scale(1.06);
    }

    100%{
        opacity:1;
        transform:
        translateX(-50%)
        scale(1);
    }
}

/* FINAL HEARTS */

.finalHeart{
    position:absolute;
    font-size:30px;
    z-index:60;
    opacity:0;
}

.hearts .finalHeart{
    animation:
    floatHeart
    3.5s
    ease-in-out
    infinite;
}

@keyframes floatHeart{

    0%{
        opacity:0;
        transform:
        translateY(25px)
        scale(.4);
    }

    30%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:
        translateY(-160px)
        scale(1.3);
    }
}

/* MOBILE */

@media(max-width:600px){

    .person{
        height:45vh;
    }

    .girl{
        left:1%;
    }

    .boy{
        right:1%;
    }

    .heart{
        font-size:22px;
        left:23%;
    }

    .handHeart{
        font-size:34px;
    }

    .door{
        width:80px;
        height:175px;
    }

    .earth{
        width:145px;
        height:145px;
    }

    .orbit{
        width:350px;
        height:260px;
    }

    .orbitBoy{
        height:125px;
    }

    .hug{
        height:58vh;
        bottom:5vh;
    }
}

</style>
</head>
<body>

<div class="scene">

    <!-- BACKGROUNDS -->

    <div class="bg room" id="room"></div>

    <div class="bg snow" id="snow"></div>

    <div class="bg desert" id="desert"></div>

    <div class="bg space" id="space"></div>


    <!-- DOOR -->

    <div class="door" id="door"></div>


    <!-- GIRL -->

    <img
        src="Girl.png"
        class="person girl"
        id="girl"
    >


    <!-- BOY -->

    <img
        src="Boy.png"
        class="person boy"
        id="boy"
    >


    <!-- HEART GIRL THROWS -->

    <div
        class="heart"
        id="heart"
    >❤️</div>


    <!-- IMPACT -->

    <div
        class="impact"
        id="impact"
    ></div>


    <!-- HEART BOY HOLDS -->

    <div
        class="handHeart"
        id="handHeart"
    >❤️</div>


    <!-- SNOW -->

    <div
        class="snowflakes"
        id="snowflakes"
    >

        <span class="flake" style="left:5%;animation-duration:5s;">❄</span>
        <span class="flake" style="left:15%;animation-duration:7s;">❄</span>
        <span class="flake" style="left:27%;animation-duration:6s;">❄</span>
        <span class="flake" style="left:40%;animation-duration:8s;">❄</span>
        <span class="flake" style="left:53%;animation-duration:5.5s;">❄</span>
        <span class="flake" style="left:66%;animation-duration:7.5s;">❄</span>
        <span class="flake" style="left:78%;animation-duration:6.5s;">❄</span>
        <span class="flake" style="left:90%;animation-duration:8.5s;">❄</span>

    </div>


    <!-- EARTH -->

    <div
        class="earth"
        id="earth"
    ></div>


    <!-- ORBIT -->

    <div
        class="orbit"
        id="orbit"
    ></div>


    <!-- HUG PNG -->

    <img
        src="Hug.png"
        class="hug"
        id="hug"
    >


    <!-- FINAL HEARTS -->

    <div class="finalHeart h1" style="left:15%;bottom:20%;">❤️</div>
    <div class="finalHeart h2" style="left:30%;bottom:35%;">💗</div>
    <div class="finalHeart h3" style="left:55%;bottom:25%;">💕</div>
    <div class="finalHeart h4" style="left:72%;bottom:40%;">❤️</div>
    <div class="finalHeart h5" style="left:45%;bottom:55%;">💖</div>

</div>
<script>

const room =
document.getElementById("room");

const snow =
document.getElementById("snow");

const desert =
document.getElementById("desert");

const space =
document.getElementById("space");

const girl =
document.getElementById("girl");

const boy =
document.getElementById("boy");

const heart =
document.getElementById("heart");

const impact =
document.getElementById("impact");

const handHeart =
document.getElementById("handHeart");

const door =
document.getElementById("door");

const snowflakes =
document.getElementById("snowflakes");

const earth =
document.getElementById("earth");

const orbit =
document.getElementById("orbit");

const hug =
document.getElementById("hug");

const finalHearts =
document.querySelectorAll(".finalHeart");


/* =====================================================
   1. GIRL THROWS HEART
===================================================== */

setTimeout(() => {

    girl.classList.add("throw");

    heart.classList.add("fly");

},1500);


/* =====================================================
   2. HEART HITS BOY
===================================================== */

setTimeout(() => {

    heart.style.opacity="0";

    boy.classList.add("hit");

    impact.classList.add("show");

},4200);


/* =====================================================
   3. HEART GOES INTO BOY'S HANDS
===================================================== */

setTimeout(() => {

    handHeart.style.left="78%";
    handHeart.style.top="51%";

    handHeart.classList.add("show");

},4850);


/* =====================================================
   4. DOOR OPENS
===================================================== */

setTimeout(() => {

    door.classList.add("open");

},5200);


/* =====================================================
   5. ROOM → SNOW
===================================================== */

setTimeout(() => {

    room.style.opacity="0";

    snow.style.opacity="1";

    snowflakes.classList.add("show");

    boy.classList.remove("hit");

    boy.classList.add("snowTravel");

    handHeart.style.left="72%";
    handHeart.style.top="51%";

},6200);


/* =====================================================
   6. SNOW → DESERT
===================================================== */

setTimeout(() => {

    snow.style.opacity="0";

    snowflakes.classList.remove("show");

    desert.style.opacity="1";

    boy.classList.remove("snowTravel");

    boy.classList.add("desertTravel");

    handHeart.style.left="25%";
    handHeart.style.top="52%";

},9800);


/* =====================================================
   7. DESERT → SPACE
===================================================== */

setTimeout(() => {

    desert.style.opacity="0";

    space.style.opacity="1";

    boy.style.opacity="0";

    handHeart.style.opacity="0";

    earth.classList.add("show");

    orbit.classList.add("show");

},13200);


/* =====================================================
   8. BOY STARTS FULL EARTH ORBIT
===================================================== */

setTimeout(() => {

    /* remove old boy position */

    boy.classList.remove("desertTravel");

    boy.classList.add("orbitBoy");

    boy.style.position="absolute";

    boy.style.left="50%";
    boy.style.top="50%";

    boy.style.right="auto";
    boy.style.bottom="auto";

    boy.style.opacity="1";

    /*
       Put heart with boy during orbit.
       The heart stays beside his hands.
    */

    handHeart.style.position="absolute";

    handHeart.style.left="50%";
    handHeart.style.top="50%";

    handHeart.style.transform=
        "translate(-50%,-50%) translate(-250px,-5px) scale(.55)";

    handHeart.style.opacity="1";

},14300);


/* =====================================================
   9. RETURN FROM EARTH
===================================================== */

setTimeout(() => {

    orbit.style.animation="none";

    orbit.style.opacity="0";

    earth.style.opacity="0";

    boy.classList.remove("orbitBoy");

    boy.style.position="absolute";

    boy.style.left="auto";

    boy.style.top="auto";

    boy.style.right="5%";

    boy.style.bottom="7vh";

    boy.style.transform="scale(1)";

    handHeart.style.opacity="1";

},19000);


/* =====================================================
   10. BOY REACHES GIRL
===================================================== */

setTimeout(() => {

    boy.style.opacity="0";

    handHeart.style.opacity="0";

    room.style.opacity="1";

    space.style.opacity="0";

    /*
       Show the combined Hug PNG.
    */

    hug.classList.add("show");

},22000);


/* =====================================================
   11. FINAL HEARTS
===================================================== */

setTimeout(() => {

    document.body.classList.add("hearts");

    finalHearts.forEach((h,i)=>{

        h.style.animationDelay =
            (i * 0.45) + "s";

    });

},23000);

</script>

</body>
</html>
