<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Little Love Story ❤️</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#09070b;
    font-family:Georgia,serif;
}

#story{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#09070b;
}

/* =========================
   SCENE SYSTEM
========================= */

.scene{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    overflow:hidden;
    transition:opacity 1s ease;
}

.scene.active{
    opacity:1;
    visibility:visible;
}

/* =========================
   CHARACTERS
========================= */

.character{
    position:absolute;
    width:270px;
    height:auto;
    user-select:none;
    -webkit-user-drag:none;
    filter:drop-shadow(0 12px 12px rgba(0,0,0,.35));
}

.girl{
    width:285px;
}

.boy{
    width:285px;
}

/* =========================
   ROOM
========================= */

.room{
    background:
        radial-gradient(circle at 50% 28%,rgba(255,190,210,.16),transparent 25%),
        linear-gradient(to bottom,#261b29 0%,#17131c 63%,#0c0a10 63%,#09070b 100%);
}

.room::before{
    content:"";
    position:absolute;
    left:0;
    right:0;
    top:0;
    height:63%;
    background:
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:55px 55px;
    opacity:.4;
}

/* floor */
.room::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:37%;
    background:
        repeating-linear-gradient(
            90deg,
            rgba(255,255,255,.035) 0px,
            rgba(255,255,255,.035) 2px,
            transparent 2px,
            transparent 75px
        ),
        linear-gradient(to bottom,#17131a,#09070b);
}

/* window */
.window{
    position:absolute;
    top:12%;
    left:9%;
    width:115px;
    height:155px;
    border:7px solid #403041;
    border-radius:5px;
    background:
        radial-gradient(circle at 70% 25%,#fff4b8 0 4px,transparent 5px),
        linear-gradient(#20294b,#11172d);
    box-shadow:0 0 30px rgba(120,130,255,.15);
    z-index:2;
}

.window:before,
.window:after{
    content:"";
    position:absolute;
    background:#403041;
}

.window:before{
    width:5px;
    height:100%;
    left:50%;
    transform:translateX(-50%);
}

.window:after{
    height:5px;
    width:100%;
    top:50%;
    transform:translateY(-50%);
}

/* lamp */
.lamp{
    position:absolute;
    right:9%;
    bottom:28%;
    width:80px;
    height:130px;
    z-index:3;
}

.lamp .shade{
    position:absolute;
    top:0;
    left:5px;
    width:70px;
    height:55px;
    background:linear-gradient(135deg,#e9b9ce,#9e627f);
    clip-path:polygon(15% 0,85% 0,100% 100%,0 100%);
    box-shadow:0 0 35px rgba(255,175,210,.25);
}

.lamp .stand{
    position:absolute;
    top:50px;
    left:37px;
    width:6px;
    height:65px;
    background:#5d4657;
}

.lamp .base{
    position:absolute;
    bottom:0;
    left:17px;
    width:45px;
    height:7px;
    border-radius:50%;
    background:#5d4657;
}

/* =========================
   GIRL FIRST SCENE
========================= */

.girl-start{
    left:50%;
    bottom:9%;
    transform:translateX(-50%);
    animation:girlBreath 3s ease-in-out infinite;
    z-index:8;
}

@keyframes girlBreath{
    0%,100%{transform:translateX(-50%) translateY(0);}
    50%{transform:translateX(-50%) translateY(-5px);}
}

/* heart starts near her raised/right hand */
.throw-heart{
    position:absolute;
    width:30px;
    height:30px;
    left:calc(50% + 91px);
    bottom:36%;
    z-index:15;
    opacity:0;
    transform:rotate(-45deg) scale(.35);
}

.throw-heart::before,
.throw-heart::after{
    content:"";
    position:absolute;
    width:30px;
    height:30px;
    border-radius:50%;
    background:#ff315f;
    box-shadow:0 0 22px rgba(255,50,95,.65);
}

.throw-heart::before{
    top:-15px;
    left:0;
}

.throw-heart::after{
    top:0;
    left:15px;
}

.throw-heart{
    background:#ff315f;
}

/* =========================
   IMPACT SCENE
========================= */

.impact-bg{
    background:
        radial-gradient(circle at 50% 45%,rgba(255,50,90,.12),transparent 22%),
        linear-gradient(#18111b,#09070b);
}

.impact-boy{
    left:50%;
    bottom:10%;
    transform:translateX(-50%);
    z-index:6;
}

.impact-heart{
    position:absolute;
    width:75px;
    height:75px;
    left:50%;
    top:43%;
    transform:translate(-50%,-50%) rotate(-45deg);
    z-index:12;
}

.impact-heart:before,
.impact-heart:after{
    content:"";
    position:absolute;
    width:75px;
    height:75px;
    border-radius:50%;
    background:#ff315f;
    box-shadow:
        0 0 25px #ff315f,
        0 0 60px rgba(255,49,95,.5);
}

.impact-heart:before{
    top:-37px;
}

.impact-heart:after{
    left:37px;
}

.impact-ring{
    position:absolute;
    left:50%;
    top:43%;
    width:80px;
    height:80px;
    border:4px solid rgba(255,255,255,.8);
    border-radius:50%;
    transform:translate(-50%,-50%);
    opacity:0;
}

.impact.active .impact-ring{
    animation:impactRing .7s ease-out forwards;
}

@keyframes impactRing{
    0%{opacity:1;width:70px;height:70px;}
    100%{opacity:0;width:430px;height:430px;}
}

.impact.active .impact-boy{
    animation:boyHit 1s cubic-bezier(.2,.8,.2,1) forwards;
}

@keyframes boyHit{
    0%{transform:translateX(-50%) rotate(0deg);}
    12%{transform:translateX(-50%) rotate(-5deg) translateX(-8px);}
    25%{transform:translateX(-50%) rotate(7deg) translateX(14px);}
    42%{transform:translateX(-50%) rotate(-6deg) translateX(-18px);}
    60%{transform:translateX(-50%) rotate(5deg) translateX(12px);}
    100%{transform:translateX(-50%) translate(250px,-10px) rotate(18deg);}
}

/* =========================
   DOOR SCENE
========================= */

.door-scene{
    background:linear-gradient(#171522,#08070c);
}

.door-frame{
    position:absolute;
    width:250px;
    height:440px;
    left:50%;
    bottom:10%;
    transform:translateX(-50%);
    border:14px solid #392b32;
    background:#120f15;
    box-shadow:
        0 0 0 5px #171117,
        0 20px 60px rgba(0,0,0,.7);
    z-index:2;
}

.door{
    position:absolute;
    inset:12px;
    background:
        linear-gradient(90deg,rgba(255,255,255,.04),transparent 30%),
        linear-gradient(#4a3540,#211820);
    border:4px solid #5b4149;
}

.door-knob{
    position:absolute;
    right:24px;
    top:52%;
    width:15px;
    height:15px;
    border-radius:50%;
    background:#e1b56b;
    box-shadow:0 0 10px rgba(225,181,107,.5);
}

.snow-light{
    position:absolute;
    inset:12px;
    opacity:0;
    background:
        radial-gradient(circle at 30% 25%,#fff 0 2px,transparent 3px),
        radial-gradient(circle at 70% 45%,#fff 0 2px,transparent 3px),
        linear-gradient(#b8d7ec,#eaf7ff);
    transition:opacity 1s ease;
}

.door-scene.open .door{
    animation:doorOpen 1.2s ease forwards;
    transform-origin:left center;
}

.door-scene.open .snow-light{
    opacity:1;
}

@keyframes doorOpen{
    to{transform:perspective(600px) rotateY(-72deg);}
}

.door-boy{
    width:210px;
    left:50%;
    bottom:15%;
    transform:translateX(-50%);
    z-index:4;
}

.door-scene.open .door-boy{
    animation:boyThroughDoor 2.2s 1s ease-in forwards;
}

@keyframes boyThroughDoor{
    0%{transform:translateX(-50%) scale(.8);}
    100%{transform:translateX(180%) scale(.45);opacity:0;}
}

/* =========================
   SNOW
========================= */

.snow-scene{
    background:
        radial-gradient(circle at 80% 15%,rgba(255,255,255,.8) 0 1px,transparent 2px),
        linear-gradient(#263b58 0%,#7699b7 45%,#eaf7ff 100%);
}

.mountain{
    position:absolute;
    bottom:28%;
    width:0;
    height:0;
    border-left:180px solid transparent;
    border-right:180px solid transparent;
    border-bottom:300px solid #536b82;
    opacity:.7;
}

.m1{left:-80px;}
.m2{right:-100px;transform:scale(1.25);}
.m3{left:35%;transform:scale(.8);bottom:30%;}

.snow-ground{
    position:absolute;
    left:-10%;
    right:-10%;
    bottom:-5%;
    height:38%;
    border-radius:50% 50% 0 0;
    background:#f7fcff;
    box-shadow:0 -15px 35px rgba(255,255,255,.3);
}

.snowflake{
    position:absolute;
    top:-20px;
    width:7px;
    height:7px;
    border-radius:50%;
    background:white;
    opacity:.8;
    animation:snowFall linear infinite;
}

@keyframes snowFall{
    to{transform:translateY(110vh) translateX(100px) rotate(360deg);}
}

.snow-boy{
    width:190px;
    left:-230px;
    bottom:18%;
    z-index:8;
}

.snow-scene.active .snow-boy{
    animation:snowJourney 5s ease-in-out forwards;
}

@keyframes snowJourney{
    0%{left:-230px;transform:rotate(-3deg);}
    45%{left:43%;transform:rotate(3deg);}
    100%{left:110%;transform:rotate(6deg);}
}

/* =========================
   DESERT
========================= */

.desert-scene{
    background:
        radial-gradient(circle at 75% 18%,#fff1b0 0 45px,rgba(255,241,176,.15) 46px,transparent 110px),
        linear-gradient(#d88755 0%,#f2b86b 48%,#d77d42 100%);
}

.dune{
    position:absolute;
    bottom:-15%;
    width:80%;
    height:45%;
    border-radius:50%;
    background:#e5a35c;
}

.dune.one{left:-30%;}
.dune.two{right:-35%;bottom:-5%;background:#c97743;}
.dune.three{left:25%;bottom:-25%;background:#d88b4d;}

.cactus{
    position:absolute;
    bottom:23%;
    width:18px;
    height:120px;
    border-radius:15px;
    background:#4e713e;
}

.cactus:before,
.cactus:after{
    content:"";
    position:absolute;
    width:50px;
    height:18px;
    border-radius:20px;
    background:#4e713e;
}

.cactus:before{
    left:-35px;
    top:40px;
}

.cactus:after{
    right:-35px;
    top:70px;
}

.c1{left:12%;}
.c2{right:17%;height:90px;}

.desert-boy{
    width:180px;
    left:-220px;
    bottom:20%;
    z-index:8;
}

.desert-scene.active .desert-boy{
    animation:desertJourney 5s ease-in-out forwards;
}

@keyframes desertJourney{
    0%{left:-220px;}
    50%{left:42%;transform:translateY(-8px);}
    100%{left:110%;transform:translateY(0);}
}

/* =========================
   EARTH / WORLD
========================= */

.world-scene{
    background:
        radial-gradient(circle at 50% 50%,#142d48 0%,#07101d 42%,#02040a 72%);
}

.stars{
    position:absolute;
    inset:0;
    background-image:
        radial-gradient(circle,white 0 1px,transparent 1.5px),
        radial-gradient(circle,rgba(255,255,255,.8) 0 1px,transparent 1.5px);
    background-size:83px 91px,137px 113px;
    opacity:.6;
}

.earth{
    position:absolute;
    left:50%;
    top:50%;
    width:300px;
    height:300px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:
        radial-gradient(circle at 35% 30%,rgba(255,255,255,.6),transparent 8%),
        radial-gradient(circle at 60% 60%,#328bc4 0 28%,#176496 48%,#0a3150 75%);
    box-shadow:
        inset -35px -25px 70px rgba(0,0,0,.7),
        0 0 55px rgba(60,170,255,.4);
}

.earth:before{
    content:"";
    position:absolute;
    inset:18px;
    border-radius:50%;
    background:
        radial-gradient(ellipse at 35% 30%,#7ba84c 0 8%,transparent 9%),
        radial-gradient(ellipse at 68% 42%,#6c9c46 0 10%,transparent 11%),
        radial-gradient(ellipse at 45% 68%,#4e833f 0 9%,transparent 10%);
    opacity:.85;
}

.orbit{
    position:absolute;
    left:50%;
    top:50%;
    width:650px;
    height:330px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:50%;
    transform:translate(-50%,-50%) rotate(-10deg);
}

.orbit-boy{
    position:absolute;
    width:135px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:10;
}

.world-scene.active .orbit-boy{
    animation:worldOrbit 6s linear forwards;
}

@keyframes worldOrbit{
    0%{
        transform:
            translate(-50%,-50%)
            translateX(325px)
            scale(.65);
    }
    25%{
        transform:
            translate(-50%,-50%)
            translate(0,-165px)
            scale(.5);
    }
    50%{
        transform:
            translate(-50%,-50%)
            translateX(-325px)
            scale(.65);
    }
    75%{
        transform:
            translate(-50%,-50%)
            translate(0,165px)
            scale(.95);
    }
    100%{
        transform:
            translate(-50%,-50%)
            translateX(325px)
            scale(.65);
    }
}

/* =========================
   RETURN TO GIRL
========================= */

.return-scene{
    background:
        radial-gradient(circle at 50% 30%,rgba(255,170,205,.15),transparent 25%),
        linear-gradient(#241923,#0b080e);
}

.return-girl{
    width:285px;
    left:50%;
    bottom:8%;
    transform:translateX(-50%);
    z-index:5;
}

.return-boy{
    width:180px;
    left:-220px;
    bottom:15%;
    z-index:6;
}

.return-scene.active .return-boy{
    animation:boyReturn 4s ease-in-out forwards;
}

@keyframes boyReturn{
    0%{
        left:-220px;
        transform:rotate(-8deg) scale(.8);
    }
    60%{
        left:42%;
        transform:rotate(4deg) scale(.82);
    }
    100%{
        left:calc(50% - 45px);
        transform:rotate(0) scale(.82);
    }
}

/* =========================
   FINAL HUG
========================= */

.final-scene{
    background:
        radial-gradient(circle at 50% 35%,rgba(255,150,195,.22),transparent 30%),
        linear-gradient(#291b29 0%,#130d15 65%,#08060b 100%);
}

.moon{
    position:absolute;
    top:9%;
    right:12%;
    width:75px;
    height:75px;
    border-radius:50%;
    background:#fff4dc;
    box-shadow:0 0 40px rgba(255,244,220,.25);
}

.final-girl{
    width:275px;
    left:50%;
    bottom:9%;
    transform:translateX(-50%);
    z-index:8;
}

/*
   Boy is placed slightly in front.
   Girl remains behind him, creating the
   back-hug composition using the original PNG.
*/
.final-boy{
    width:220px;
    left:50%;
    bottom:11%;
    transform:translateX(-35%);
    z-index:10;
}

.final-scene.active .final-girl{
    animation:finalGirl 2.2s ease-out forwards;
}

.final-scene.active .final-boy{
    animation:finalBoy 2.2s ease-out forwards;
}

@keyframes finalGirl{
    0%{
        transform:translateX(-50%) translateX(130px);
        opacity:0;
    }
    70%{
        transform:translateX(-50%) translateX(10px);
        opacity:1;
    }
    100%{
        transform:translateX(-50%) translateX(0);
        opacity:1;
    }
}

@keyframes finalBoy{
    0%{
        transform:translateX(-35%) translateY(-15px);
    }
    65%{
        transform:translateX(-35%) translateY(0);
    }
    100%{
        transform:translateX(-35%) translateY(0);
    }
}

/* arms effect for hug */
.hug-arm{
    position:absolute;
    z-index:12;
    width:120px;
    height:42px;
    border-radius:50%;
    border:15px solid #b779a0;
    border-top-color:transparent;
    border-left-color:transparent;
    opacity:0;
    pointer-events:none;
}

.arm-left{
    left:calc(50% - 115px);
    bottom:30%;
    transform:rotate(25deg);
}

.arm-right{
    left:calc(50% + 5px);
    bottom:31%;
    transform:rotate(150deg);
}

.final-scene.active .hug-arm{
    animation:armsAppear 1s 1.6s ease forwards;
}

@keyframes armsAppear{
    to{opacity:.9;}
}

.kiss{
    position:absolute;
    z-index:20;
    left:calc(50% + 54px);
    bottom:42%;
    font-family:Arial,sans-serif;
    font-size:42px;
    opacity:0;
    transform:scale(.2) rotate(-12deg);
}

.final-scene.active .kiss{
    animation:kissPop 1.1s 2.7s ease-out forwards;
}

@keyframes kissPop{
    0%{opacity:0;transform:scale(.2) rotate(-12deg);}
    55%{opacity:1;transform:scale(1.2) rotate(-12deg);}
    100%{opacity:1;transform:scale(1) rotate(-12deg);}
}

.final-heart{
    position:absolute;
    left:50%;
    top:18%;
    font-size:34px;
    opacity:0;
}

.final-scene.active .final-heart{
    animation:heartFloat 2s 3.1s ease-out forwards;
}

@keyframes heartFloat{
    0%{opacity:0;transform:translateY(30px) scale(.5);}
    40%{opacity:1;}
    100%{opacity:0;transform:translateY(-90px) scale(1.3);}
}

/* =========================
   CAPTION
========================= */

.caption{
    position:absolute;
    left:50%;
    top:7%;
    transform:translateX(-50%);
    color:white;
    text-align:center;
    font-size:clamp(18px,4vw,30px);
    letter-spacing:1px;
    text-shadow:0 3px 15px rgba(0,0,0,.8);
    z-index:50;
    width:90%;
    opacity:0;
    transition:opacity .7s ease;
}

.scene.active .caption{
    opacity:1;
}

/* =========================
   REPLAY
========================= */

#replay{
    position:absolute;
    z-index:100;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    border:1px solid rgba(255,255,255,.3);
    background:rgba(0,0,0,.45);
    color:white;
    padding:10px 24px;
    border-radius:30px;
    font-size:15px;
    cursor:pointer;
    backdrop-filter:blur(8px);
    opacity:0;
    transition:.4s;
}

#replay.show{
    opacity:1;
}

#replay:hover{
    background:rgba(255,70,110,.3);
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .character,
    .girl{
        width:230px;
    }

    .boy{
        width:230px;
    }

    .girl-start,
    .return-girl,
    .final-girl{
        width:245px;
    }

    .impact-boy{
        width:245px;
    }

    .door-boy{
        width:185px;
    }

    .earth{
        width:230px;
        height:230px;
    }

    .orbit{
        width:500px;
        height:260px;
    }

    .orbit-boy{
        width:110px;
    }

    .caption{
        top:4%;
        font-size:19px;
    }

    .door-frame{
        width:205px;
        height:380px;
    }
}
</style>
</head>

<body>

<div id="story">

    <!-- =========================
         SCENE 1 — GIRL + HEART
    ========================== -->

    <section class="scene room active" id="scene1">

        <div class="window"></div>

        <div class="lamp">
            <div class="shade"></div>
            <div class="stand"></div>
            <div class="base"></div>
        </div>

        <div class="caption">
            Sometimes... love begins with a tiny little heart ❤️
        </div>

        <img
            class="character girl girl-start"
            src="https://raw.githubusercontent.com/adira54-creator/love-heart-animation/main/Girl.png"
            alt="Girl"
        >

        <div class="throw-heart" id="throwHeart"></div>
    </section>


    <!-- =========================
         SCENE 2 — HEART IMPACT
    ========================== -->

    <section class="scene impact-bg" id="scene2">

        <div class="caption">
            And then... BOOM! ❤️
        </div>

        <img
            class="character impact-boy"
            src="https://raw.githubusercontent.com/adira54-creator/love-heart-animation/main/Boy.png"
            alt="Boy"
        >

        <div class="impact-heart"></div>
        <div class="impact-ring"></div>

    </section>


    <!-- =========================
         SCENE 3 — DOOR
    ========================== -->

    <section class="scene door-scene" id="scene3">

        <div class="caption">
            One little heart changed his whole journey...
        </div>

        <div class="door-frame">
            <div class="door">
                <div class="door-knob"></div>
                <div class="snow-light"></div>
            </div>
        </div>

        <img
            class="character door-boy"
            src="https://raw.githubusercontent.com/adira54-creator/love-heart-animation/main/Boy.png"
            alt="Boy"
        >

    </section>


    <!-- =======================
     SCENE 4 – SNOW
======================== -->

<section class="scene snow-scene" id="scene4">

    <div class="caption">
        Through the snow... ❄️
    </div>

    <div class="mountain m1"></div>
    <div class="mountain m2"></div>
    <div class="mountain m3"></div>
    <div class="snow-ground"></div>

    <div class="snowflake" style="left:5%;animation-duration:5s;"></div>
    <div class="snowflake" style="left:14%;animation-duration:7s;"></div>
    <div class="snowflake" style="left:25%;animation-duration:6s;"></div>
    <div class="snowflake" style="left:38%;animation-duration:8s;"></div>
    <div class="snowflake" style="left:52%;animation-duration:5.5s;"></div>
    <div class="snowflake" style="left:65%;animation-duration:7.5s;"></div>
    <div class="snowflake" style="left:77%;animation-duration:6.5s;"></div>
    <div class="snowflake" style="left:90%;animation-duration:8.5s;"></div>

    <img class="character snow-boy" src="https://raw.githubusercontent.com/adira54-creator/love-heart-animation/main/Boy.png" alt="Boy" />

</section>


<!-- =======================
     SCENE 5 – DESERT
======================== -->

<section class="scene desert-scene" id="scene5">

    <div class="caption">
        Across the desert... ☀️
    </div>

    <div class="dune one"></div>
    <div class="dune two"></div>
    <div class="dune three"></div>

    <div class="cactus c1"></div>
    <div class="cactus c2"></div>

    <img class="character desert-boy" src="https://raw.githubusercontent.com/adira54-creator/love-heart-animation/main/Boy.png" alt="Boy" />

</section>


<!-- =======================
     SCENE 6 – EARTH
======================== -->

<section class="scene world-scene" id="scene6">

    <div class="stars"></div>

    <div class="caption">
        Around the whole world... 🌍
    </div>

    <div class="earth"></div>
    <div class="orbit"></div>

    <img class="orbit-boy" src="https://raw.githubusercontent.com/adira54-creator/love-heart-animation/main/Boy.png" alt="Boy" />

</section>


<!-- =======================
     SCENE 7 – RETURN
======================== -->

<section class="scene return-scene" id="scene7">

    <div class="caption">
        No matter how far he went...
    </div>

    <img class="character return-girl" src="https://raw.githubusercontent.com/adira54-creator/love-heart-animation/main/Girl.png" alt="Girl" />

    <img class="character return-boy" src="https://raw.githubusercontent.com/adira54-creator/love-heart-animation/main/Boy.png" alt="Boy" />

</section>


<!-- =======================
     SCENE 8 – FINAL HUG
======================== -->

<section class="scene final-scene" id="scene8">

    <div class="moon"></div>

    <div class="caption">
        ...his heart always knew where to return. ❤️
    </div>

    <img class="character final-girl" src="https://raw.githubusercontent.com/adira54-creator/love-heart-animation/main/Girl.png" alt="Girl" />

    <img class="character final-boy" src="https://raw.githubusercontent.com/adira54-creator/love-heart-animation/main/Boy.png" alt="Boy" />

    <div class="hug-arm arm-left"></div>
    <div class="hug-arm arm-right"></div>

    <div class="kiss">💋</div>

    <div class="final-heart">❤️</div>

</section>

<button id="replay">Replay ❤️</button>

</div>


<script>

/*
----------------------------------------
==========
   LOVE STORY CONTROLLER
========================================
----------------------------------------
*/

const scenes = [
    document.getElementById("scene1"),
    document.getElementById("scene2"),
    document.getElementById("scene3"),
    document.getElementById("scene4"),
    document.getElementById("scene5"),
    document.getElementById("scene6"),
    document.getElementById("scene7"),
    document.getElementById("scene8")
];

const throwHeart = document.getElementById("throwHeart");
const replay = document.getElementById("replay");

let currentScene = 0;
let timer = null;


/*
----------------------------------------
---------
   CHANGE SCENE
----------------------------------------
---------
*/

function showScene(number){

    scenes.forEach((scene, index)=>{

        if(index === number){
            scene.classList.add("active");
        }else{
            scene.classList.remove("active");
        }

    });

    currentScene = number;

}


/*
----------------------------------------
---------
   HEART THROW ANIMATION
----------------------------------------
---------
*/

function throwTheHeart(){

    throwHeart.style.opacity = "1";

    throwHeart.animate(
        [
            {
                left:"calc(50% + 91px)",
                bottom:"36%",
                transform:"rotate(-45deg) scale(.35)"
            },
            {
                left:"calc(50% + 145px)",
                bottom:"39%",
                transform:"rotate(-45deg) scale(.65)"
            },
            {
                left:"calc(50% + 205px)",
                bottom:"41%",
                transform:"rotate(-45deg) scale(1.15)"
            }
        ],
        {
            duration: 1800,
            easing:"cubic-bezier(.2,.7,.2,1)",
            fill:"forwards"
        }
    );

}


/*
----------------------------------------
---------
   RESET HEART
----------------------------------------
---------
*/

function resetHeart(){

    throwHeart.style.opacity = "0";

    throwHeart.getAnimations().forEach(animation => {
        animation.cancel();
    });

    throwHeart.style.left = "calc(50% + 91px)";
    throwHeart.style.bottom = "36%";
    throwHeart.style.transform = "rotate(-45deg) scale(.35)";

}


/*
----------------------------------------
---------
   START STORY
----------------------------------------
---------
*/

function startStory(){

    clearTimeout(timer);

    replay.classList.remove("show");

    resetHeart();

    /* Reset special classes */

    scenes.forEach(scene=>{
        scene.classList.remove("open");
    });

    showScene(0);

    /* Girl holds heart for a moment */

    timer = setTimeout(()=>{

        throwTheHeart();

    }, 1800);

    /* Heart travels */

        timer = setTimeout(()=>{

        showScene(1);

    }, 3900);


    /* Impact scene */

    timer = setTimeout(()=>{

        showScene(2);

        const doorScene = document.getElementById("scene3");

        timer = setTimeout(()=>{

            showScene(3);

        }, 3000);

    }, 5900);


    /* Snow scene */

    timer = setTimeout(()=>{

        showScene(3);

    }, 8900);


    /* Desert */

    timer = setTimeout(()=>{

        showScene(4);

    }, 14100);


    /* Earth */

    timer = setTimeout(()=>{

        showScene(5);

    }, 19300);


    /* Return */

    timer = setTimeout(()=>{

        showScene(6);

    }, 26300);


    /* Final hug */

    timer = setTimeout(()=>{

        showScene(7);

    }, 31300);


    /* Replay */

    timer = setTimeout(()=>{

        replay.classList.add("show");

    }, 36500);

}


/*
----------------------------------------
---------
   DOOR OPEN WHEN ENTERING DOOR SCENE
----------------------------------------
---------
*/

const originalShowScene = showScene;

showScene = function(number){

    originalShowScene(number);

    if(number === 2){

        const doorScene = document.getElementById("scene3");

        setTimeout(()=>{

            doorScene.classList.add("open");

        }, 500);

    }

};


/*
----------------------------------------
---------
   REPLAY
----------------------------------------
---------
*/

replay.addEventListener("click", ()=>{

    startStory();

});


/*
----------------------------------------
---------
   START AUTOMATICALLY
----------------------------------------
---------
*/

window.addEventListener("load", ()=>{

    setTimeout(()=>{

        startStory();

    }, 500);

});

</script>

</body>
</html>
