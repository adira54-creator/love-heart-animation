<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Our Journey ❤️</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}

#scene{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
}

/* ---------- WORLDS ---------- */

.world{
  position:absolute;
  inset:0;
  opacity:0;
  pointer-events:none;
  transition:opacity 1s ease;
}

#home{
  opacity:1;
  background:
    radial-gradient(circle at 50% 25%,#ffeaf2,#efa8c4 55%,#75445b);
}

#snow{
  background:linear-gradient(#8fc9e9,#eaf9ff 60%,#fff);
}

#desert{
  background:
    linear-gradient(
      #62c9ff 0%,
      #c8efff 48%,
      #e8ad62 49%,
      #c77c35 100%
    );
}

#space{
  background:
    radial-gradient(circle at 12% 18%,#fff 1px,transparent 2px),
    radial-gradient(circle at 30% 70%,#fff 1px,transparent 2px),
    radial-gradient(circle at 48% 25%,#fff 1px,transparent 2px),
    radial-gradient(circle at 67% 78%,#fff 1px,transparent 2px),
    radial-gradient(circle at 82% 32%,#fff 1px,transparent 2px),
    radial-gradient(circle at 93% 65%,#fff 1px,transparent 2px),
    #02030e;
}

/* ---------- CHARACTERS ---------- */

.character{
  position:absolute;
  width:auto;
  height:55vh;
  max-height:560px;
  object-fit:contain;
  z-index:20;
  user-select:none;
  pointer-events:none;
}

#girl{
  left:4%;
  bottom:6vh;
}

#boy{
  right:4%;
  bottom:6vh;
}

/* ---------- START HEART ---------- */

#heart{
  position:absolute;
  left:22%;
  bottom:38%;
  font-size:25px;
  z-index:40;
  filter:drop-shadow(0 0 12px #ff4f91);
}
    /* ---------- GIRL THROW ---------- */

#girl.throwing{
  animation:girlThrow 1s ease-in-out forwards;
}

@keyframes girlThrow{
  0%{
    transform:rotate(0);
  }
  25%{
    transform:translate(12px,-8px) rotate(-4deg);
  }
  50%{
    transform:translate(25px,-2px) rotate(6deg);
  }
  75%{
    transform:translate(12px,-5px) rotate(-3deg);
  }
  100%{
    transform:translate(0) rotate(0);
  }
}

/* ---------- HEART FLIGHT ---------- */

#heart.flying{
  animation:heartFlight 2.6s cubic-bezier(.2,.75,.2,1) forwards;
}

@keyframes heartFlight{

  0%{
    left:22%;
    bottom:39%;
    transform:scale(.45) rotate(0);
  }

  18%{
    left:30%;
    bottom:44%;
    transform:scale(.75) rotate(-10deg);
  }

  42%{
    left:45%;
    bottom:50%;
    transform:scale(1.15) rotate(12deg);
  }

  65%{
    left:60%;
    bottom:46%;
    transform:scale(1.45) rotate(-8deg);
  }

  84%{
    left:74%;
    bottom:38%;
    transform:scale(1.75) rotate(8deg);
  }

  100%{
    left:82%;
    bottom:31%;
    transform:scale(2) rotate(0);
  }
}

/* ---------- IMPACT ---------- */

#impact{
  position:absolute;
  right:13%;
  bottom:29%;
  width:100px;
  height:100px;
  border-radius:50%;
  z-index:45;
  opacity:0;
  background:
    radial-gradient(circle,
      #fff 0 8%,
      #ff70a5 20%,
      transparent 68%);
}

#impact.show{
  animation:impact .8s ease-out forwards;
}

@keyframes impact{
  0%{
    opacity:0;
    transform:scale(.2);
  }
  30%{
    opacity:1;
    transform:scale(1.2);
  }
  100%{
    opacity:0;
    transform:scale(3);
  }
}

/* ---------- BOY HIT ---------- */

#boy.hit{
  animation:boyHit .9s ease-out forwards;
}

@keyframes boyHit{
  0%{
    transform:translate(0,0) rotate(0);
  }
  20%{
    transform:translate(30px,-25px) rotate(8deg);
  }
  45%{
    transform:translate(-28px,-45px) rotate(-9deg);
  }
  70%{
    transform:translate(18px,-18px) rotate(5deg);
  }
  100%{
    transform:translate(0,0) rotate(0);
  }
}

/* ---------- HEART IN HAND ---------- */

#heldHeart{
  position:absolute;
  z-index:35;
  font-size:43px;
  opacity:0;
  pointer-events:none;
  filter:drop-shadow(0 0 12px #ff4f91);
}

#heldHeart.visible{
  opacity:1;
}
    /* ---------- DOOR ---------- */

#door{
  position:absolute;
  right:5%;
  bottom:5%;
  width:120px;
  height:245px;
  z-index:15;
  opacity:0;

  background:
    linear-gradient(
      90deg,
      #3a1d12,
      #8b5536,
      #492517
    );

  border:5px solid #29130c;
  border-radius:8px 8px 0 0;

  transform-origin:left center;
}

#door.visible{
  opacity:1;
}

#door.open{
  animation:openDoor 1s ease forwards;
}

@keyframes openDoor{
  from{
    transform:perspective(600px) rotateY(0);
  }
  to{
    transform:perspective(600px) rotateY(-72deg);
  }
}

/* ---------- SNOW ---------- */

#snowflakes{
  position:absolute;
  inset:0;
  z-index:10;
  opacity:0;
  pointer-events:none;
}

#snowflakes.visible{
  opacity:1;
}

.flake{
  position:absolute;
  top:-30px;
  color:white;
  font-size:18px;
  animation:snowFall linear infinite;
}

@keyframes snowFall{
  from{
    transform:translateY(-30px) translateX(0) rotate(0);
  }
  to{
    transform:translateY(110vh) translateX(90px) rotate(360deg);
  }
}

/* ---------- SNOW JOURNEY ---------- */

#boy.snowJourney{
  animation:snowJourney 3s ease-in-out forwards;
}

@keyframes snowJourney{
  0%{
    right:4%;
    bottom:6vh;
    transform:scale(1);
  }
  35%{
    right:28%;
    bottom:7vh;
    transform:scale(.9);
  }
  70%{
    right:52%;
    bottom:8vh;
    transform:scale(.82);
  }
  100%{
    right:73%;
    bottom:7vh;
    transform:scale(.76);
  }
}

/* ---------- DESERT JOURNEY ---------- */

#boy.desertJourney{
  animation:desertJourney 3s ease-in-out forwards;
}

@keyframes desertJourney{
  0%{
    right:73%;
    bottom:7vh;
    transform:scale(.76);
  }
  30%{
    right:52%;
    bottom:14vh;
    transform:scale(.72);
  }
  65%{
    right:28%;
    bottom:10vh;
    transform:scale(.68);
  }
  100%{
    right:5%;
    bottom:7vh;
    transform:scale(.64);
  }
}
    /* ---------- EARTH ---------- */

#earth{
  position:absolute;
  left:50%;
  top:50%;
  width:210px;
  height:210px;
  border-radius:50%;
  z-index:5;
  opacity:0;

  transform:translate(-50%,-50%) scale(.2);

  background:
    radial-gradient(
      ellipse at 28% 32%,
      #58a951 0 8%,
      transparent 9%
    ),
    radial-gradient(
      ellipse at 68% 28%,
      #63b457 0 9%,
      transparent 10%
    ),
    radial-gradient(
      ellipse at 60% 67%,
      #4b9e49 0 13%,
      transparent 14%
    ),
    radial-gradient(
      ellipse at 32% 72%,
      #63b653 0 8%,
      transparent 9%
    ),
    radial-gradient(
      circle at 35% 30%,
      #78dcff,
      #248bd5 48%,
      #07518d 78%,
      #021d36
    );

  box-shadow:
    0 0 35px #55caff,
    0 0 85px rgba(70,190,255,.7),
    inset -25px -15px 35px rgba(0,0,0,.45);
}

#earth.visible{
  animation:earthAppear 1s ease forwards;
}

@keyframes earthAppear{
  from{
    opacity:0;
    transform:translate(-50%,-50%) scale(.2);
  }
  to{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
}

/* ---------- ORBIT ---------- */

#orbit{
  position:absolute;
  left:50%;
  top:50%;
  width:520px;
  height:350px;
  border:2px solid rgba(255,255,255,.45);
  border-radius:50%;
  z-index:12;
  opacity:0;
  transform:translate(-50%,-50%) rotate(-12deg);
}

#orbit.visible{
  opacity:1;
}

/* ---------- ORBIT BOY ---------- */

#boy.orbiting{
  position:absolute;
  left:50%;
  top:50%;
  right:auto;
  bottom:auto;
  height:150px;
  z-index:25;

  animation:fullOrbit 6s linear infinite;
}

@keyframes fullOrbit{

  0%{
    transform:translate(-260px,-5px) scale(.58);
  }

  12.5%{
    transform:translate(-185px,-125px) scale(.5);
  }

  25%{
    transform:translate(0,-180px) scale(.43);
  }

  37.5%{
    transform:translate(185px,-125px) scale(.5);
  }

  50%{
    transform:translate(260px,-5px) scale(.58);
  }

  62.5%{
    transform:translate(185px,115px) scale(.5);
  }

  75%{
    transform:translate(0,175px) scale(.43);
  }

  87.5%{
    transform:translate(-185px,115px) scale(.5);
  }

  100%{
    transform:translate(-260px,-5px) scale(.58);
  }
}

/* ---------- ORBIT HEART ---------- */

#orbitHeart{
  position:absolute;
  left:50%;
  top:50%;
  z-index:27;
  font-size:35px;
  opacity:0;

  animation:orbitHeart 6s linear infinite;
}

#orbitHeart.visible{
  opacity:1;
}

@keyframes orbitHeart{

  0%{
    transform:translate(-285px,-8px) scale(.6);
  }

  12.5%{
    transform:translate(-205px,-128px) scale(.52);
  }

  25%{
    transform:translate(-15px,-188px) scale(.45);
  }

  37.5%{
    transform:translate(205px,-128px) scale(.52);
  }

  50%{
    transform:translate(285px,-8px) scale(.6);
  }

  62.5%{
    transform:translate(205px,112px) scale(.52);
  }

  75%{
    transform:translate(-15px,182px) scale(.45);
  }

  87.5%{
    transform:translate(-205px,112px) scale(.52);
  }

  100%{
    transform:translate(-285px,-8px) scale(.6);
  }
}
    /* ---------- RETURN ---------- */

#boy.returning{
  animation:returnBoy 3s ease-in-out forwards;
}

@keyframes returnBoy{

  0%{
    left:50%;
    top:50%;
    right:auto;
    bottom:auto;
    transform:translate(-50%,-50%) scale(.45);
  }

  40%{
    left:67%;
    top:58%;
    transform:translate(-50%,-50%) scale(.7);
  }

  100%{
    left:auto;
    right:5%;
    top:auto;
    bottom:6vh;
    transform:scale(1);
  }
}

/* ---------- HUG PNG ---------- */

#hug{
  position:absolute;
  left:50%;
  bottom:2vh;
  width:auto;
  height:72vh;
  max-height:680px;
  z-index:80;

  object-fit:contain;
  opacity:0;

  transform:translateX(-50%) scale(.45);

  pointer-events:none;
}

#hug.show{
  animation:hugShow 1.5s cubic-bezier(.2,.8,.2,1) forwards;
}

@keyframes hugShow{

  0%{
    opacity:0;
    transform:translateX(-50%) scale(.45);
  }

  60%{
    opacity:1;
    transform:translateX(-50%) scale(1.06);
  }

  100%{
    opacity:1;
    transform:translateX(-50%) scale(1);
  }
}

/* ---------- FINAL HEARTS ---------- */

.finalHeart{
  position:absolute;
  z-index:90;
  font-size:30px;
  opacity:0;
  pointer-events:none;
}

#finalHearts.active .finalHeart{
  animation:floatFinal 3.5s ease-in-out infinite;
}

@keyframes floatFinal{

  0%{
    opacity:0;
    transform:translateY(20px) scale(.5);
  }

  30%{
    opacity:1;
  }

  100%{
    opacity:0;
    transform:translateY(-160px) scale(1.3);
  }
}

/* ---------- MOBILE ---------- */

@media(max-width:600px){

  .character{
    height:45vh;
  }

  #girl{
    left:0;
  }

  #boy{
    right:0;
  }

  #earth{
    width:145px;
    height:145px;
  }

  #orbit{
    width:350px;
    height:260px;
  }

  #boy.orbiting{
    height:120px;
  }

  #hug{
    height:58vh;
    bottom:5vh;
  }

  #door{
    width:85px;
    height:180px;
  }
}
</style>
</head>

<body>

<div id="scene">

  <!-- WORLDS -->

  <div id="home" class="world"></div>

  <div id="snow" class="world"></div>

  <div id="desert" class="world"></div>

  <div id="space" class="world"></div>


  <!-- DOOR -->

  <div id="door"></div>


  <!-- GIRL -->

  <img
    id="girl"
    class="character"
    src="Girl.png"
    alt=""
  >


  <!-- BOY -->

  <img
    id="boy"
    class="character"
    src="Boy.png"
    alt=""
  >


  <!-- GIRL'S HEART -->

  <div id="heart">❤️</div>


  <!-- IMPACT -->

  <div id="impact"></div>


  <!-- HEART BOY HOLDS -->

  <div id="heldHeart">❤️</div>


  <!-- SNOW -->

  <div id="snowflakes">

    <span class="flake" style="left:4%;animation-duration:5s">❄</span>
    <span class="flake" style="left:14%;animation-duration:7s">❄</span>
    <span class="flake" style="left:25%;animation-duration:6s">❄</span>
    <span class="flake" style="left:37%;animation-duration:8s">❄</span>
    <span class="flake" style="left:49%;animation-duration:5.5s">❄</span>
    <span class="flake" style="left:61%;animation-duration:7.5s">❄</span>
    <span class="flake" style="left:74%;animation-duration:6.5s">❄</span>
    <span class="flake" style="left:87%;animation-duration:8.5s">❄</span>

  </div>


  <!-- EARTH -->

  <div id="earth"></div>

  <div id="orbit"></div>

  <div id="orbitHeart">❤️</div>


  <!-- FINAL HUG -->

  <img
    id="hug"
    src="Hug.png"
    alt=""
  >


  <!-- FINAL HEARTS -->

  <div id="finalHearts">

    <div class="finalHeart" style="left:15%;bottom:20%">❤️</div>
    <div class="finalHeart" style="left:30%;bottom:35%">💗</div>
    <div class="finalHeart" style="left:55%;bottom:25%">💕</div>
    <div class="finalHeart" style="left:72%;bottom:40%">❤️</div>
    <div class="finalHeart" style="left:45%;bottom:55%">💖</div>

  </div>

</div>
<script>

const home =
document.getElementById("home");

const snow =
document.getElementById("snow");

const desert =
document.getElementById("desert");

const space =
document.getElementById("space");

const girl =
document.getElementById("girl");

const boy =
document.getElementById("boy");

const heart =
document.getElementById("heart");

const impact =
document.getElementById("impact");

const heldHeart =
document.getElementById("heldHeart");

const door =
document.getElementById("door");

const snowflakes =
document.getElementById("snowflakes");

const earth =
document.getElementById("earth");

const orbit =
document.getElementById("orbit");

const orbitHeart =
document.getElementById("orbitHeart");

const hug =
document.getElementById("hug");

const finalHearts =
document.getElementById("finalHearts");


/* --------------------------------
   SCENE 1
   GIRL THROWS HEART
-------------------------------- */

setTimeout(function(){

  girl.classList.add("throwing");

  heart.classList.add("flying");

},1500);


/* --------------------------------
   SCENE 2
   HEART HITS BOY
-------------------------------- */

setTimeout(function(){

  heart.style.display="none";

  boy.classList.add("hit");

  impact.classList.add("show");

},4200);


/* --------------------------------
   SCENE 3
   HEART IN BOY'S HAND
-------------------------------- */

setTimeout(function(){

  heldHeart.style.left="78%";
  heldHeart.style.top="51%";

  heldHeart.classList.add("visible");

},4750);


/* --------------------------------
   SCENE 4
   DOOR
-------------------------------- */

setTimeout(function(){

  door.classList.add("visible");

},5100);

setTimeout(function(){

  door.classList.add("open");

},5400);


/* --------------------------------
   SCENE 5
   SNOW WORLD
-------------------------------- */

setTimeout(function(){

  home.style.opacity="0";

  snow.style.opacity="1";

  snowflakes.classList.add("visible");

  boy.classList.remove("hit");

  boy.classList.add("snowJourney");

  heldHeart.style.left="73%";
  heldHeart.style.top="50%";

},6200);
    /* --------------------------------
   SCENE 6
   DESERT
-------------------------------- */

setTimeout(function(){

  snow.style.opacity="0";

  snowflakes.classList.remove("visible");

  desert.style.opacity="1";

  boy.classList.remove("snowJourney");

  boy.classList.add("desertJourney");

  heldHeart.style.left="26%";
  heldHeart.style.top="51%";

},9500);


/* --------------------------------
   SCENE 7
   SPACE + EARTH
-------------------------------- */

setTimeout(function(){

  desert.style.opacity="0";

  space.style.opacity="1";

  boy.style.opacity="0";

  heldHeart.style.opacity="0";

  earth.classList.add("visible");

  orbit.classList.add("visible");

},13000);


/* --------------------------------
   SCENE 8
   FULL EARTH ORBIT
-------------------------------- */

setTimeout(function(){

  boy.classList.remove("desertJourney");

  boy.classList.add("orbiting");

  boy.style.opacity="1";

  orbitHeart.classList.add("visible");

},14300);


/* --------------------------------
   SCENE 9
   RETURN
-------------------------------- */

setTimeout(function(){

  boy.classList.remove("orbiting");

  orbitHeart.classList.remove("visible");

  orbit.classList.remove("visible");

  earth.style.opacity="0";

  boy.classList.add("returning");

},19300);


/* --------------------------------
   SCENE 10
   FINAL HUG
-------------------------------- */

setTimeout(function(){

  boy.style.opacity="0";

  heldHeart.style.opacity="0";

  space.style.opacity="0";

  home.style.opacity="1";

  /*
     IMPORTANT:
     This is your uploaded Hug.png
  */

  hug.classList.add("show");

},22500);


/* --------------------------------
   SCENE 11
   FINAL HEARTS
-------------------------------- */

setTimeout(function(){

  finalHearts.classList.add("active");

  const hearts =
  finalHearts.querySelectorAll(".finalHeart");

  hearts.forEach(function(h,i){

    h.style.animationDelay =
      (i * 0.45) + "s";

  });

},23500);

</script>

</body>
</html>
