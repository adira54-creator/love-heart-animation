<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Journey ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

.scene{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
}

/* =====================================================
   ALL SCENES
===================================================== */

.sceneLayer{
    position:absolute;
    inset:0;
    opacity:0;
    pointer-events:none;
    transition:opacity 1.2s ease;
}

.sceneLayer.active{
    opacity:1;
}


/* =====================================================
   SCENE 1 — GIRL'S ROOM
===================================================== */

.room{
    background:
        radial-gradient(
            circle at 50% 25%,
            #ffeaf3 0%,
            #f6bfd4 35%,
            #a65e7b 100%
        );
}

.room::before{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:30%;
    background:
        linear-gradient(
            #d69aa9,
            #9b5c70
        );
}

.roomWindow{
    position:absolute;
    width:24vw;
    height:32vh;
    max-width:190px;
    max-height:260px;
    left:12%;
    top:14%;
    border:10px solid rgba(255,255,255,.45);
    background:
        linear-gradient(
            135deg,
            #b9e9ff,
            #fff
        );
    box-shadow:
        0 0 25px rgba(255,255,255,.35);
}

.roomLight{
    position:absolute;
    width:40vw;
    height:40vw;
    max-width:450px;
    max-height:450px;
    left:50%;
    top:5%;
    transform:translateX(-50%);
    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.5),
            transparent 65%
        );
}


/* =====================================================
   CHARACTERS
===================================================== */

.girl{
    position:absolute;
    height:58vh;
    max-height:550px;
    width:auto;
    left:8%;
    bottom:5vh;
    z-index:20;
    object-fit:contain;
}

.boy{
    position:absolute;
    height:56vh;
    max-height:530px;
    width:auto;
    right:8%;
    bottom:6vh;
    z-index:20;
    object-fit:contain;
    opacity:0;
}


/* =====================================================
   SMALL HEART IN GIRL'S HAND
===================================================== */

.handHeart{
    position:absolute;
    z-index:25;
    left:38%;
    bottom:37%;
    font-size:25px;

    filter:
        drop-shadow(0 0 8px #ff4f91);

    transform:
        scale(.7);
}


/* =====================================================
   THROWING HEART
===================================================== */

.handHeart.fly{
    animation:
        heartJourney 2.6s cubic-bezier(.2,.8,.2,1) forwards;
}

@keyframes heartJourney{

    0%{
        left:38%;
        bottom:37%;
        font-size:25px;
        transform:
            scale(.7)
            rotate(0deg);
    }

    20%{
        left:45%;
        bottom:43%;
        font-size:45px;
        transform:
            scale(1)
            rotate(-8deg);
    }

    45%{
        left:57%;
        bottom:50%;
        font-size:65px;
        transform:
            scale(1.1)
            rotate(10deg);
    }

    70%{
        left:69%;
        bottom:46%;
        font-size:72px;
        transform:
            scale(1)
            rotate(-8deg);
    }

    92%{
        left:79%;
        bottom:39%;
        font-size:68px;
        transform:
            scale(.95)
            rotate(5deg);
    }

    100%{
        left:83%;
        bottom:38%;
        font-size:60px;
        transform:
            scale(.85)
            rotate(0deg);
    }
}


/* =====================================================
   IMPACT
===================================================== */

.impact{
    animation:
        boyImpact .65s cubic-bezier(.2,.8,.3,1);
}

@keyframes boyImpact{

    0%{
        transform:
            translateX(0)
            rotate(0);
    }

    20%{
        transform:
            translateX(45px)
            rotate(8deg);
    }

    45%{
        transform:
            translateX(-35px)
            rotate(-7deg);
    }

    70%{
        transform:
            translateX(20px)
            rotate(4deg);
    }

    100%{
        transform:
            translateX(0)
            rotate(0);
    }
}


/* =====================================================
   IMPACT FLASH
===================================================== */

.impactFlash{
    position:absolute;
    width:20px;
    height:20px;
    border-radius:50%;
    background:#fff;
    box-shadow:
        0 0 20px #fff,
        0 0 50px #ff4f91,
        0 0 90px #ff4f91;
    opacity:0;
    z-index:40;
}

.impactFlash.show{
    animation:
        flash .55s ease-out forwards;
}

@keyframes flash{

    0%{
        opacity:1;
        transform:scale(.5);
    }

    100%{
        opacity:0;
        transform:scale(8);
    }
}


/* =====================================================
   DOOR WORLD
===================================================== */

.doorWorld{
    background:
        linear-gradient(
            90deg,
            #15121a 0%,
            #25202a 50%,
            #111 100%
        );
}

.door{
    position:absolute;
    width:34vw;
    height:65vh;
    max-width:300px;
    max-height:560px;
    left:50%;
    bottom:0;
    transform:translateX(-50%);

    background:
        linear-gradient(
            90deg,
            #3a2020,
            #7a4a3c,
            #291717
        );

    border:
        12px solid #241313;

    box-shadow:
        inset 0 0 35px #000,
        0 0 30px rgba(255,255,255,.1);
}

.door.open{
    animation:
        doorOpen 1.2s ease-in-out forwards;
    transform-origin:left center;
}

@keyframes doorOpen{

    0%{
        transform:
            translateX(-50%)
            perspective(500px)
            rotateY(0);
    }

    100%{
        transform:
            translateX(-50%)
            perspective(500px)
            rotateY(-72deg);
    }
}

.doorLight{
    position:absolute;
    width:28vw;
    height:60vh;
    max-width:260px;
    max-height:520px;
    left:50%;
    bottom:0;
    transform:translateX(-50%);

    background:
        radial-gradient(
            ellipse,
            #eaffff,
            #a9eaff 45%,
            transparent 72%
        );

    opacity:0;
}

.doorLight.show{
    animation:
        doorLight 1.2s forwards;
}

@keyframes doorLight{

    0%{
        opacity:0;
    }

    50%{
        opacity:.9;
    }

    100%{
        opacity:1;
    }
}


/* =====================================================
   SNOW
===================================================== */

.snowWorld{
    background:
        linear-gradient(
            #8fc7e8 0%,
            #dff5ff 52%,
            #f7fbff 100%
        );
}

.snowGround{
    position:absolute;
    left:-5%;
    right:-5%;
    bottom:-5%;
    height:40%;
    background:
        linear-gradient(
            #fff,
            #dcecf5
        );
    border-radius:50% 50% 0 0;
}

.snowflake{
    position:absolute;
    top:-30px;
    color:white;
    font-size:20px;
    opacity:.9;
    animation:
        snowfall linear infinite;
}

@keyframes snowfall{

    from{
        transform:
            translateY(-40px)
            rotate(0);
    }

    to{
        transform:
            translateY(110vh)
            rotate(360deg);
    }
}


/* =====================================================
   BOY SNOW JOURNEY
===================================================== */

.snowTravel{
    animation:
        snowTravel 3s ease-in-out forwards;
}

@keyframes snowTravel{

    0%{
        right:50%;
        bottom:18vh;
        transform:scale(.65);
    }

    50%{
        right:35%;
        bottom:14vh;
        transform:scale(.72);
    }

    100%{
        right:12%;
        bottom:10vh;
        transform:scale(.8);
    }
}


/* =====================================================
   DESERT
===================================================== */

.desertWorld{
    background:
        linear-gradient(
            #63c6fa 0%,
            #bcecff 43%,
            #e7aa59 44%,
            #c77b32 100%
        );
}

.sun{
    position:absolute;
    width:110px;
    height:110px;
    border-radius:50%;
    right:12%;
    top:12%;
    background:#fff3b0;
    box-shadow:
        0 0 40px #ffe59a,
        0 0 90px #ffd35a;
}

.dune{
    position:absolute;
    left:-10%;
    width:120%;
    height:45%;
    bottom:-15%;
    border-radius:50% 50% 0 0;
    background:
        linear-gradient(
            #e4a14e,
            #b9682e
        );
}

.dune.two{
    bottom:5%;
    background:
        linear-gradient(
            #efbb68,
            #d38335
        );
    opacity:.8;
}


/* =====================================================
   DESERT JOURNEY
===================================================== */

.desertTravel{
    animation:
        desertJourney 3s ease-in-out forwards;
}

@keyframes desertJourney{

    0%{
        right:12%;
        bottom:10vh;
        transform:scale(.8);
    }

    50%{
        right:50%;
        bottom:22vh;
        transform:scale(.6);
    }

    100%{
        right:82%;
        bottom:14vh;
        transform:scale(.48);
    }
}


/* =====================================================
   SPACE / EARTH
===================================================== */

.spaceWorld{
    background:
        radial-gradient(circle at 20% 25%,white 1px,transparent 2px),
        radial-gradient(circle at 70% 15%,white 1px,transparent 2px),
        radial-gradient(circle at 45% 70%,white 1px,transparent 2px),
        radial-gradient(circle at 85% 65%,white 1px,transparent 2px),
        radial-gradient(circle at 10% 80%,white 1px,transparent 2px),
        #02030d;

    background-size:
        170px 170px,
        230px 230px,
        200px 200px,
        250px 250px,
        190px 190px;
}

.earth{
    position:absolute;
    width:210px;
    height:210px;
    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #7deaff,
            #2588dc 40%,
            #07509a 68%,
            #021c45 100%
        );

    box-shadow:
        0 0 35px #47cfff,
        0 0 90px #1974c5;

    z-index:5;
}

.earth::before{
    content:"";
    position:absolute;
    width:80px;
    height:45px;
    left:25px;
    top:45px;
    border-radius:50%;
    background:#52c96d;
    transform:rotate(-20deg);
    opacity:.75;
}

.earth::after{
    content:"";
    position:absolute;
    width:95px;
    height:55px;
    right:20px;
    bottom:35px;
    border-radius:50%;
    background:#48bd68;
    transform:rotate(25deg);
    opacity:.7;
}

.orbitRing{
    position:absolute;
    width:380px;
    height:220px;
    left:50%;
    top:50%;
    transform:
        translate(-50%,-50%)
        rotate(-15deg);
    border:
        2px solid rgba(255,255,255,.5);
    border-radius:50%;
    z-index:8;
}


/* =====================================================
   WORLD ORBIT BOY
===================================================== */

.worldBoy{
    position:absolute;
    height:28vh;
    max-height:260px;
    width:auto;
    left:50%;
    top:50%;
    z-index:15;

    animation:
        worldOrbit 6s linear forwards;
}

@keyframes worldOrbit{

    0%{
        transform:
            translate(-190px,0)
            scale(.45);
    }

    12.5%{
        transform:
            translate(-135px,-95px)
            scale(.42);
    }

    25%{
        transform:
            translate(0,-125px)
            scale(.4);
    }

    37.5%{
        transform:
            translate(140px,-85px)
            scale(.42);
    }

    50%{
        transform:
            translate(190px,0)
            scale(.45);
    }

    62.5%{
        transform:
            translate(135px,90px)
            scale(.48);
    }

    75%{
        transform:
            translate(0,125px)
            scale(.52);
    }

    87.5%{
        transform:
            translate(-140px,85px)
            scale(.48);
    }

    100%{
        transform:
            translate(-190px,0)
            scale(.45);
    }
}


/* =====================================================
   RETURN TO GIRL
===================================================== */

.returnBoy{
    animation:
        returnJourney 3.5s cubic-bezier(.2,.8,.2,1) forwards;
}

@keyframes returnJourney{

    0%{
        left:50%;
        top:50%;
        transform:
            translate(-190px,0)
            scale(.45);
    }

    35%{
        left:70%;
        top:48%;
        transform:
            translate(0,0)
            scale(.6);
    }

    70%{
        left:45%;
        top:55%;
        transform:
            translate(0,0)
            scale(.75);
    }

    100%{
        left:20%;
        top:auto;
        bottom:5vh;
        transform:
            translate(0,0)
            scale(1);
    }
}


/* =====================================================
   FINAL HUG
===================================================== */

.finalGirl{
    position:absolute;
    height:58vh;
    max-height:550px;
    width:auto;
    left:8%;
    bottom:5vh;
    z-index:30;
}

.finalBoy{
    position:absolute;
    height:56vh;
    max-height:530px;
    width:auto;
    left:15%;
    bottom:5vh;
    z-index:29;

    opacity:0;

    animation:
        finalBoyAppear 1.5s ease forwards;
}

@keyframes finalBoyAppear{

    from{
        opacity:0;
        transform:translateX(80px);
    }

    to{
        opacity:1;
        transform:translateX(0);
    }
}

.hugArms{
    position:absolute;
    width:160px;
    height:120px;
    left:16%;
    bottom:27%;
    z-index:40;
    opacity:0;
}

.hugArms.show{
    animation:
        armsHug 1s ease-out forwards;
}

@keyframes armsHug{

    from{
        opacity:0;
        transform:scale(.5);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

.kissHeart{
    position:absolute;
    left:27%;
    bottom:47%;
    font-size:25px;
    z-index:50;
    opacity:0;
}

.kissHeart.show{
    animation:
        kissPop 1.3s ease-out forwards;
}

@keyframes kissPop{

    0%{
        opacity:0;
        transform:scale(.3);
    }

    35%{
        opacity:1;
        transform:scale(1.2);
    }

    100%{
        opacity:0;
        transform:
            translateY(-35px)
            scale(.8);
    }
}


/* =====================================================
   FINAL HEARTS
===================================================== */

.finalHeart{
    position:absolute;
    z-index:60;
    font-size:28px;
    opacity:0;
}

.finalHeart.show{
    animation:
        finalFloat 3s ease-out forwards;
}

@keyframes finalFloat{

    0%{
        opacity:0;
        transform:
            translateY(20px)
            scale(.4);
    }

    30%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:
            translateY(-160px)
            scale(1.2);
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .girl{
        height:48vh;
        left:3%;
        bottom:7vh;
    }

    .boy{
        height:46vh;
        right:3%;
        bottom:7vh;
    }

    .handHeart{
        left:35%;
        bottom:34%;
        font-size:20px;
    }

    .roomWindow{
        width:28vw;
        height:25vh;
    }

    .door{
        width:48vw;
        height:62vh;
    }

    .earth{
        width:145px;
        height:145px;
    }

    .orbitRing{
        width:270px;
        height:165px;
    }

    .worldBoy{
        height:22vh;
    }

    .finalGirl{
        height:48vh;
        left:3%;
    }

    .finalBoy{
        height:46vh;
        left:10%;
    }

    .hugArms{
        left:12%;
        bottom:26%;
    }

    .kissHeart{
        left:25%;
        bottom:44%;
    }
}
</style>
</head>


<body>

<div class="scene">


<!-- =====================================================
     SCENE 1 — GIRL ROOM
===================================================== -->

<div class="sceneLayer room active" id="room">

    <div class="roomLight"></div>

    <div class="roomWindow"></div>

    <img
        src="Girl.png"
        class="girl"
        id="girl"
    >

    <div
        class="handHeart"
        id="handHeart">
        ❤️
    </div>

</div>


<!-- =====================================================
     SCENE 2 — DOOR
===================================================== -->

<div class="sceneLayer doorWorld" id="doorWorld">

    <div
        class="doorLight"
        id="doorLight">
    </div>

    <div
        class="door"
        id="door">
    </div>

</div>


<!-- =====================================================
     SCENE 3 — SNOW
===================================================== -->

<div
    class="sceneLayer snowWorld"
    id="snowWorld">

    <div class="snowGround"></div>

    <div class="snowflake" style="left:8%;animation-duration:5s;">❄</div>
    <div class="snowflake" style="left:18%;animation-duration:7s;animation-delay:1s;">❄</div>
    <div class="snowflake" style="left:30%;animation-duration:6s;animation-delay:2s;">❄</div>
    <div class="snowflake" style="left:45%;animation-duration:8s;">❄</div>
    <div class="snowflake" style="left:60%;animation-duration:5.5s;animation-delay:1.5s;">❄</div>
    <div class="snowflake" style="left:75%;animation-duration:7s;">❄</div>
    <div class="snowflake" style="left:90%;animation-duration:6s;animation-delay:2s;">❄</div>

</div>


<!-- =====================================================
     SCENE 4 — DESERT
===================================================== -->

<div
    class="sceneLayer desertWorld"
    id="desertWorld">

    <div class="sun"></div>

    <div class="dune"></div>
    <div class="dune two"></div>

</div>


<!-- =====================================================
     SCENE 5 — SPACE / EARTH
===================================================== -->

<div
    class="sceneLayer spaceWorld"
    id="spaceWorld">

    <div class="earth"></div>

    <div class="orbitRing"></div>

</div>


<!-- =====================================================
     BOY
===================================================== -->

<img
    src="Boy.png"
    class="boy"
    id="boy"
>


<!-- =====================================================
     IMPACT
===================================================== -->

<div
    class="impactFlash"
    id="impactFlash">
</div>


<!-- =====================================================
     FINAL HUG SCENE
===================================================== -->

<div
    class="sceneLayer"
    id="finalScene"
    style="
        background:
        radial-gradient(
            circle at 50% 25%,
            #ffeaf3,
            #f5bfd2 40%,
            #9b5872 100%
        );
    ">

    <img
        src="Girl.png"
        class="finalGirl"
        id="finalGirl"
    >

    <img
        src="Boy.png"
        class="finalBoy"
        id="finalBoy"
    >

    <!-- arms wrapping from behind -->
    <div
        class="hugArms"
        id="hugArms">
        🫂
    </div>

    <!-- cheek kiss -->
    <div
        class="kissHeart"
        id="kissHeart">
        💋
    </div>

    <div
        class="finalHeart"
        id="fh1"
        style="left:18%;bottom:30%;">
        ❤️
    </div>

    <div
        class="finalHeart"
        id="fh2"
        style="left:35%;bottom:45%;">
        💗
    </div>

    <div
        class="finalHeart"
        id="fh3"
        style="left:55%;bottom:35%;">
        💕
    </div>

    <div
        class="finalHeart"
        id="fh4"
        style="left:70%;bottom:48%;">
        💖
    </div>

</div>


</div>


<script>

/* ======================
